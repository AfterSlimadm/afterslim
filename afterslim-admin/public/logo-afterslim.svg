<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 56" fill="none">
  <defs>
    <linearGradient id="swoosh" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#005F8A"/>
      <stop offset="50%" stop-color="#0091CC"/>
      <stop offset="100%" stop-color="#00B8E6"/>
    </linearGradient>
    <linearGradient id="swooshLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00A3D9"/>
      <stop offset="100%" stop-color="#66D4F0"/>
    </linearGradient>
  </defs>
  <!-- Swoosh arc behind text -->
  <path d="M6 42 Q10 6, 56 6 Q100 6, 76 42" fill="none" stroke="url(#swoosh)" stroke-width="3" stroke-linecap="round"/>
  <path d="M2 46 Q8 2, 58 2 Q106 2, 80 46" fill="none" stroke="url(#swooshLight)" stroke-width="1.8" stroke-linecap="round" opacity="0.5"/>
  <!-- "After" bold -->
  <text x="28" y="42" font-family="'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="36" font-weight="700" fill="#1A2B3C" letter-spacing="-0.5">After</text>
  <!-- "Slim" light -->
  <text x="134" y="42" font-family="'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="36" font-weight="300" fill="#4A5568" letter-spacing="-0.5">Slim</text>
  <!-- TM -->
  <text x="218" y="18" font-family="'Inter', Arial, sans-serif" font-size="9" fill="#9CA3AF">&#8482;</text>
</svg>
