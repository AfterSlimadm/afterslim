<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" fill="none">
  <defs>
    <!-- Outer swoosh gradient: bright teal to deep navy -->
    <linearGradient id="swooshOuter" x1="0.1" y1="0.9" x2="0.9" y2="0.1">
      <stop offset="0%" stop-color="#5CC8E6"/>
      <stop offset="30%" stop-color="#0099CC"/>
      <stop offset="70%" stop-color="#006E99"/>
      <stop offset="100%" stop-color="#003F5C"/>
    </linearGradient>
    <!-- Inner swoosh: lighter teal -->
    <linearGradient id="swooshInner" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#7DD8EE"/>
      <stop offset="50%" stop-color="#33B5D9"/>
      <stop offset="100%" stop-color="#0088B3"/>
    </linearGradient>
    <!-- Thin accent swoosh -->
    <linearGradient id="swooshAccent" x1="0" y1="1" x2="0.8" y2="0">
      <stop offset="0%" stop-color="#AAE4F2"/>
      <stop offset="100%" stop-color="#55C0DD"/>
    </linearGradient>
    <!-- Text gradient for "After" -->
    <linearGradient id="textGrad" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0%" stop-color="#0099BB"/>
      <stop offset="40%" stop-color="#006B8A"/>
      <stop offset="100%" stop-color="#1B2D3E"/>
    </linearGradient>
  </defs>

  <!-- Outer swoosh: wide elongated C-curve -->
  <path d="M12 64 C6 56, 2 44, 4 30 C6 14, 18 4, 42 2 C66 0, 100 6, 118 20 C128 28, 122 38, 106 44 C90 49, 64 48, 42 44"
        fill="none" stroke="url(#swooshOuter)" stroke-width="5" stroke-linecap="round"/>

  <!-- Middle swoosh: offset, slightly lighter -->
  <path d="M18 60 C14 52, 10 42, 12 30 C14 16, 26 8, 48 6 C70 4, 100 10, 116 24"
        fill="none" stroke="url(#swooshInner)" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>

  <!-- Thin accent swoosh: innermost -->
  <path d="M24 56 C22 48, 20 40, 22 32 C24 22, 34 14, 52 12"
        fill="none" stroke="url(#swooshAccent)" stroke-width="1.2" stroke-linecap="round" opacity="0.35"/>

  <!-- "After" bold italic -->
  <text x="54" y="56" font-family="'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="44" font-weight="700" font-style="italic" fill="url(#textGrad)" letter-spacing="-1">After</text>

  <!-- "Slim" light italic -->
  <text x="176" y="56" font-family="'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="44" font-weight="300" font-style="italic" fill="#1B2D3E" letter-spacing="-0.5">Slim</text>

  <!-- TM superscript -->
  <text x="272" y="22" font-family="'Inter', Arial, sans-serif" font-size="10" font-weight="600" fill="#1B2D3E" opacity="0.8">&#8482;</text>
</svg>
