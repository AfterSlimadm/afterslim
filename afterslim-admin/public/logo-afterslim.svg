<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 90" fill="none">
  <defs>
    <linearGradient id="swoosh-outer" x1="0" y1="0.7" x2="0.8" y2="0.2">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="20%" stop-color="#7BCFE3"/>
      <stop offset="50%" stop-color="#2BA4C3"/>
      <stop offset="80%" stop-color="#1B6E8A"/>
      <stop offset="100%" stop-color="#1B3D52"/>
    </linearGradient>
    <linearGradient id="swoosh-inner" x1="0.1" y1="0.8" x2="0.9" y2="0.3">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="30%" stop-color="#9DDAEB"/>
      <stop offset="60%" stop-color="#4DB8D4"/>
      <stop offset="100%" stop-color="#2A7D9B"/>
    </linearGradient>
    <linearGradient id="text-gradient" x1="0" y1="0.5" x2="1" y2="0.5">
      <stop offset="0%" stop-color="#1E8EAD"/>
      <stop offset="100%" stop-color="#1A3548"/>
    </linearGradient>
  </defs>

  <!-- Outer swoosh (thicker, main curve) -->
  <path d="M18 72 Q2 58, 4 40 Q6 22, 22 12 Q40 2, 72 2 Q110 2, 148 18 Q168 22, 178 28"
        fill="none" stroke="url(#swoosh-outer)" stroke-width="5" stroke-linecap="round"/>

  <!-- Inner swoosh (thinner, tighter curve) -->
  <path d="M30 68 Q16 56, 18 42 Q20 28, 34 20 Q50 10, 78 10 Q112 10, 146 24 Q162 30, 170 34"
        fill="none" stroke="url(#swoosh-inner)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- "After" bold italic -->
  <text x="58" y="62" font-family="'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="48" font-weight="700" font-style="italic" fill="url(#text-gradient)" letter-spacing="-1.5">After</text>

  <!-- "Slim" light italic -->
  <text x="196" y="62" font-family="'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="48" font-weight="300" font-style="italic" fill="#1A3044" letter-spacing="-0.5">Slim</text>

  <!-- TM -->
  <text x="302" y="24" font-family="'Inter', Arial, sans-serif" font-size="11" font-weight="600" fill="#1A3044" opacity="0.75">&#8482;</text>
</svg>
