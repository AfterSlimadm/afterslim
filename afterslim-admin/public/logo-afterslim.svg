<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" fill="none">
  <defs>
    <linearGradient id="swoosh" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#5BC5E0"/>
      <stop offset="40%" stop-color="#0091B3"/>
      <stop offset="100%" stop-color="#1B3A4B"/>
    </linearGradient>
    <linearGradient id="textAfter" x1="0" y1="0.5" x2="1" y2="0.5">
      <stop offset="0%" stop-color="#0091B3"/>
      <stop offset="100%" stop-color="#1B3A4B"/>
    </linearGradient>
  </defs>

  <!-- Single swoosh curve wrapping from bottom-left over the top -->
  <path d="M8 68 C2 52, 2 36, 8 24 C16 8, 36 2, 62 2 C88 2, 114 8, 134 22"
        fill="none" stroke="url(#swoosh)" stroke-width="4.5" stroke-linecap="round"/>

  <!-- "After" bold italic -->
  <text x="50" y="56" font-family="'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="44" font-weight="700" font-style="italic" fill="url(#textAfter)" letter-spacing="-1">After</text>

  <!-- "Slim" light -->
  <text x="172" y="56" font-family="'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="44" font-weight="300" font-style="italic" fill="#1B2D3E" letter-spacing="-0.5">Slim</text>

  <!-- TM -->
  <text x="268" y="22" font-family="'Inter', Arial, sans-serif" font-size="10" font-weight="600" fill="#1B2D3E" opacity="0.7">&#8482;</text>
</svg>
