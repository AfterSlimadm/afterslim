  .confirm-card .confirm-cta {
    display: inline-flex;
    align-items: center;

    font-size: 15px;

    text-transform: uppercase;
    padding: 14px 28px;
    border: 0;

    text-decoration: none;
    transition: background 0.15s;
  }
  .confirm-card .confirm-cta:hover { background: var(--orange-dark); color: #fff; }

<main class="auth-shell">
  <div class="auth-card confirm-card">
    <div class="confirm-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
    </div>
    <h1>Email confirmed</h1>
    <p id="confirmMessage">Your AfterSlim account is ready. Taking you to your dashboard...</p>
    <a href="/account" class="confirm-cta" id="confirmCta">Go to my account</a>
    <p class="confirm-redirect-note" id="confirmRedirectNote">Redirecting in a moment.</p>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="/js/supabase-client.js"></script>
<script>
(function() {
  var msg = document.getElementById('confirmMessage');
  var note = document.getElementById('confirmRedirectNote');
  var cta = document.getElementById('confirmCta');
  var redirected = false;

  function goToAccount() {
    if (redirected) return;
    redirected = true;
    window.location.href = '/';
  }

  // If the Supabase JS SDK detected a session from the URL hash, the
  // onAuthStateChange fires with SIGNED_IN. Honor that and redirect.
  window.afterslimSupabase.auth.onAuthStateChange(function(event) {
    if (event === 'SIGNED_IN' || event === 'TOKEN_REFRESHED') {
      goToAccount();
    }
  });

  // Also poll getSession() once after a short delay in case the
  // SDK already had a session cached before this script ran.
  setTimeout(async function() {
    var { data } = await window.afterslimSupabase.auth.getSession();
    if (data.session) { goToAccount(); return; }
    // No session after a reasonable wait. Tell the user the account
    // is confirmed but they need to sign in manually.
    msg.textContent = "You're all set. Sign in to access your account.";
    note.style.display = 'none';
    cta.textContent = 'Sign in';
    cta.href = '/account/login';
  }, 1500);

  // Safety net: even if the SDK never reports SIGNED_IN, send the user
  // to /account after 4s and let requireAuth() bounce them if needed.
  setTimeout(goToAccount, 4000);
})();
</script>
