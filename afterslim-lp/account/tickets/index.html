<style>
.tickets-head {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  flex-wrap: wrap;
  gap: 16px;
  margin-bottom: 8px;
}
.tickets-head .new-ticket-btn {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 9px 16px;
  background: var(--orange); color: #fff;
  border-radius: 999px;
  font-family: inherit;
  font-size: 13.5px; font-weight: 600;
  text-decoration: none;
  transition: background 0.15s;
}
.tickets-head .new-ticket-btn:hover { background: var(--orange-dark); color: #fff; }
.tickets-head .new-ticket-btn svg { stroke-width: 2.2; }

.tickets-list {
  margin-top: 26px;
  border-top: 1px solid var(--line);
}
.ticket-row {
  display: grid;
  grid-template-columns: 14px 1fr auto auto;
  align-items: center;
  gap: 14px;
  padding: 16px 6px;
  border-bottom: 1px solid var(--line);
  text-decoration: none;
  color: var(--ink);
  transition: background 0.12s;
}
.ticket-row:hover { background: rgba(31,20,16,0.025); color: var(--ink); }
.ticket-dot {
  width: 8px; height: 8px; border-radius: 999px;
  display: inline-block; justify-self: center;
}
.ticket-dot[data-s="open"], .ticket-dot[data-s="pending"] { background: var(--orange); box-shadow: 0 0 0 3px rgba(234,88,12,0.15); }
.ticket-dot[data-s="resolved"] { background: #16a34a; box-shadow: 0 0 0 3px rgba(22,163,74,0.15); }
.ticket-dot[data-s="closed"] { background: #9ca3af; }
.ticket-main { min-width: 0; }
.ticket-subject {
  font-size: 15px; font-weight: 600;
  margin: 0;
  color: var(--ink);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.ticket-meta {
  font-size: 12.5px; color: var(--ink-2);
  margin: 3px 0 0;
  display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
}
.ticket-meta .sep { opacity: 0.4; }
.ticket-number {
  font-size: 12.5px; color: var(--ink-2);
  font-variant-numeric: tabular-nums;
  font-feature-settings: 'tnum';
}
.ticket-status {
  font-size: 12.5px;
  text-transform: capitalize;
  color: var(--ink-2);
  min-width: 70px; text-align: right;
}
.ticket-status[data-s="open"], .ticket-status[data-s="pending"] { color: var(--orange-dark); font-weight: 600; }
.ticket-status[data-s="resolved"] { color: #15803d; font-weight: 600; }

.tickets-empty {
  margin-top: 56px;
  text-align: center;
  display: flex; flex-direction: column; align-items: center; gap: 18px;
}
.tickets-empty-icon {
  width: 56px; height: 56px;
  border-radius: 999px;
  background: var(--bg-2);
  display: flex; align-items: center; justify-content: center;
  color: var(--ink-2);
}
.tickets-empty p {
  font-size: 14.5px; color: var(--ink-2);
  margin: 0; max-width: 360px; line-height: 1.55;
}
.tickets-empty-cta {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 10px 18px;
  background: var(--orange); color: #fff;
  border-radius: 999px;
  font-size: 14px; font-weight: 600;
  text-decoration: none;
  transition: background 0.15s;
}
.tickets-empty-cta:hover { background: var(--orange-dark); color: #fff; }

@media (max-width: 600px) {
  .ticket-row { grid-template-columns: 12px 1fr auto; gap: 10px; padding: 14px 4px; }
  .ticket-number { display: none; }              /* mobile: keep dot, subject, status — drop the ID */
}
</style>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="/js/supabase-client.js"></script>
<script>
(async function() {
  var user = await window.afterslimAuth.requireAuth();
  var supabase = window.afterslimSupabase;

  var { data: tickets } = await supabase
    .from('support_tickets')
    .select('id, ticket_number, subject, status, category, created_at, updated_at')
    .eq('profile_id', user.id)
    .order('updated_at', { ascending: false });

  if (!tickets || tickets.length === 0) {
    document.getElementById('emptyState').style.display = 'flex';
    return;
  }

  // Customer-facing labels for the raw category enum stored in the DB.
  var CATEGORY_LABEL = {
    order_issue: 'Order issue',
    shipping: 'Shipping',
    billing: 'Billing',
    product_question: 'Product question',
    side_effects: 'Side effects',
    account: 'Account',
    other: 'Other',
  };
  function categoryLabel(raw) {
    if (!raw) return '';
    return CATEGORY_LABEL[raw] || raw.replace(/_/g, ' ').replace(/^./, function(c) { return c.toUpperCase(); });
  }

  function activityLabel(iso) {
    var d = new Date(iso);
    var now = new Date();
    var diffMs = now - d;
    var diffMin = Math.floor(diffMs / 60000);
    var diffHr = Math.floor(diffMin / 60);
    var diffDay = Math.floor(diffHr / 24);
    if (diffMin < 1) return 'just now';
    if (diffMin < 60) return diffMin + ' min ago';
    if (diffHr < 24) return diffHr + 'h ago';
    if (diffDay < 7) return diffDay + 'd ago';
    return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
  }

  var list = document.getElementById('ticketsList');
  list.style.display = '';
  list.innerHTML = tickets.map(function(t) {
    var when = activityLabel(t.updated_at || t.created_at);
    var cat = categoryLabel(t.category);
    var metaParts = [when];
    if (cat) metaParts.push(cat);
    var metaHtml = metaParts.map(function(p, i) {
      var sep = i > 0 ? '<span class="sep" aria-hidden="true">·</span>' : '';
      return sep + '<span>' + escapeHtml(p) + '</span>';
    }).join('');
    return '<a class="ticket-row" href="/account/tickets/view?id=' + t.id + '">'
      + '<span class="ticket-dot" data-s="' + t.status + '" aria-hidden="true"></span>'
      + '<div class="ticket-main">'
        + '<p class="ticket-subject">' + escapeHtml(t.subject) + '</p>'
        + '<p class="ticket-meta">' + metaHtml + '</p>'
      + '</div>'
      + '<span class="ticket-number">' + escapeHtml(t.ticket_number || '') + '</span>'
      + '<span class="ticket-status" data-s="' + t.status + '">' + t.status + '</span>'
    + '</a>';
  }).join('');
})();

function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c) {
    return ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' })[c];
  });
}
</script>
