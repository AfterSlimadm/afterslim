<main class="auth-shell">
  <div class="auth-card">
    <div class="auth-logo"><img src="/images/logo-afterslim-tight.png" alt="AfterSlim"></div>
    <h1>Set a new password</h1>
    <p class="auth-lede" id="lede">Pick a new password. Once you save, you'll be signed in.</p>

    <div id="authError" class="auth-error" style="display: none;"></div>
    <div id="authSuccess" class="auth-success" style="display: none;"></div>

    <form class="auth-form" id="newPwForm" novalidate>
      <div>
        <label for="password">New password</label>
        <input id="password" name="password" type="password" autocomplete="new-password" required minlength="8">
        <p class="auth-hint">At least 8 characters, with one uppercase letter, one lowercase letter, and one special character.</p>
      </div>
      <div>
        <label for="confirm">Confirm new password</label>
        <input id="confirm" name="confirm" type="password" autocomplete="new-password" required minlength="8">
      </div>
      <button type="submit" id="newPwBtn">Save and sign in</button>
    </form>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="/js/supabase-client.js"></script>
<script>
(async function() {
  // Supabase auto-detects the recovery token in the URL hash and sets a
  // session for the password-update step. If no session is present after
  // detection, the link is invalid or expired.
  var form = document.getElementById('newPwForm');
  var btn = document.getElementById('newPwBtn');
  var errBox = document.getElementById('authError');
  var okBox = document.getElementById('authSuccess');
  var lede = document.getElementById('lede');

  // Wait a tick for detectSessionInUrl to fire
  await new Promise(function(resolve) { setTimeout(resolve, 200); });

  var session = await window.afterslimAuth.session();
  if (!session) {
    form.style.display = 'none';
    errBox.textContent = "This reset link is invalid or expired. Please request a new one.";
    errBox.style.display = 'block';
    lede.innerHTML = '<a href="/account/forgot-password" style="color: var(--orange-dark); font-weight: 600;">Request a new reset link</a>';
  }

  form.addEventListener('submit', async function(e) {
    e.preventDefault();
    errBox.style.display = 'none';
    okBox.style.display = 'none';

    var pw = document.getElementById('password').value;
    var confirm = document.getElementById('confirm').value;

    var pwError = validatePassword(pw);
    if (pwError) {
      errBox.textContent = pwError;
      errBox.style.display = 'block';
      return;
    }
    if (pw !== confirm) {
      errBox.textContent = 'Passwords do not match.';
      errBox.style.display = 'block';
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Saving...';

    var { error } = await window.afterslimAuth.updatePassword(pw);

    if (error) {
      errBox.textContent = error.message || 'Could not update password. Try again.';
      errBox.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Save and sign in';
      return;
    }

    okBox.textContent = 'Password updated. Redirecting to your account...';
    okBox.style.display = 'block';
    setTimeout(function() { window.location.href = '/account'; }, 1200);
  });
})();

function validatePassword(pw) {
  if (pw.length < 8)        return 'Password must be at least 8 characters.';
  if (!/[A-Z]/.test(pw))    return 'Password must include at least one uppercase letter (A-Z).';
  if (!/[a-z]/.test(pw))    return 'Password must include at least one lowercase letter (a-z).';
  if (!/[^A-Za-z0-9]/.test(pw)) return 'Password must include at least one special character (e.g. ! @ # $ % &).';
  return null;
}
</script>
