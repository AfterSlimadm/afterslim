<style>
/* Settings-class page: a real form. Stripe / Linear / Notion all use a
   clean white surface for CRUD-heavy admin views; the warm tint reads
   as marketing on a page where the customer is editing structured data. */
body { background: #ffffff; }
/* Grid estilo Amazon: 3 colunas, cards com badge "Default" no topo,
   endereco no meio, links de acao no rodape separados por barra vertical. */
.addr-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 18px;
  margin-bottom: 28px;
}
@media (max-width: 640px) { .addr-grid { grid-template-columns: 1fr; } }

.addr-card {
  background: #fff;
  border: 1px solid #d5d9d9;
  border-radius: 8px;
  padding: 22px 22px 0;
  display: flex;
  flex-direction: column;
  min-height: 260px;
}
.addr-card.default { border-color: #c2410c; border-width: 1.5px; }
.addr-default-strip {
  background: #fafafa;
  border-bottom: 1px solid #e7e7e7;
  margin: -22px -22px 18px;
  padding: 10px 22px;
  font-size: 12px;
  font-weight: 600;
  color: #565959;
  display: flex;
  align-items: center;
  gap: 8px;
}
.addr-default-strip svg { flex-shrink: 0; color: #c2410c; }
.addr-name {
  font-size: 16px;
  font-weight: 700;
  color: #0f1111;
  margin: 0 0 8px;
}
.addr-body {
  font-size: 13.5px;
  line-height: 1.55;
  color: #0f1111;
  margin: 0 0 auto;
  padding-bottom: 16px;
}
.addr-body .line { display: block; }
.addr-body .phone { color: #565959; margin-top: 6px; }
.addr-actions {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 0 18px;
  border-top: 1px solid #f3f3f3;
  font-size: 13px;
}
.addr-actions .sep { color: #d5d9d9; }
.addr-btn {
  background: none;
  border: 0;
  padding: 0;
  color: #c2410c;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  font-family: inherit;
  text-decoration: none;
}
.addr-btn:hover { color: #8a2f0d; text-decoration: underline; }

.addr-add {
  background: #fafafa;
  border: 1.5px dashed #d5d9d9;
  border-radius: 8px;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
  font-size: 15px;
  font-weight: 500;
  color: #565959;
  min-height: 260px;
  font-family: inherit;
  transition: border-color 0.15s, background 0.15s;
}
.addr-add svg { color: #c2410c; }
.addr-add:hover { border-color: #c2410c; background: #fff3e6; color: #c2410c; }

.addr-form {
  background: var(--bg-2); border: 1px solid var(--line);
  border-radius: 14px; padding: 24px;
  display: grid; gap: 12px;
  margin-bottom: 24px;
  scroll-margin-top: 100px;
}
.addr-form h3 { font-size: 17px; font-weight: 800; margin: 0 0 6px; }
.addr-form .row-two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 540px) { .addr-form .row-two { grid-template-columns: 1fr; } }
.addr-form label { font-size: 12.5px; font-weight: 600; color: var(--ink); display: block; margin-bottom: 4px; }
.addr-form input, .addr-form select {
  width: 100%; font-family: inherit; font-size: 14.5px;
  background: #fff; border: 1px solid var(--line); border-radius: 8px;
  padding: 10px 12px; outline: 0;
}
.addr-form input:focus, .addr-form select:focus {
  border-color: var(--orange); box-shadow: 0 0 0 3px rgba(234,88,12,0.12);
}
.addr-form-actions { display: flex; gap: 10px; margin-top: 8px; }
.addr-form-actions button {
  font-size: 14px; font-weight: 700; letter-spacing: 0.4px; text-transform: uppercase;
  padding: 12px 22px; border-radius: 999px; border: 0; cursor: pointer; font-family: inherit;
}
.addr-form-submit { background: var(--orange); color: #fff; }
.addr-form-submit:hover { background: var(--orange-dark); }
.addr-form-cancel { background: transparent; color: var(--ink); border: 1px solid var(--line); }
</style>

  <h1>Addresses</h1>
  <p class="account-page-lede">Manage shipping addresses for orders and subscriptions. The default is used at checkout.</p>

  <div id="addrList" class="addr-grid"></div>

  <form class="addr-form" id="addrForm" style="display: none; margin-top: 24px;">
    <h3 id="addrFormTitle">Add address</h3>
    <input type="hidden" id="addr_id">
    <div>
      <label for="addr_label">Label (optional)</label>
      <input id="addr_label" type="text" placeholder="Home, Work, etc.">
    </div>
    <div class="row-two">
      <div><label for="addr_first">First name</label><input id="addr_first" type="text" required></div>
      <div><label for="addr_last">Last name</label><input id="addr_last" type="text" required></div>
    </div>
    <div><label for="addr_line1">Address line 1</label><input id="addr_line1" type="text" placeholder="123 Main St" autocomplete="address-line1" required></div>
    <div><label for="addr_line2">Address line 2 (optional)</label><input id="addr_line2" type="text" placeholder="Apt, suite, unit, etc." autocomplete="address-line2"></div>
    <div class="row-two">
      <div><label for="addr_city">City</label><input id="addr_city" type="text" required></div>
      <div><label for="addr_state">State</label><select id="addr_state" autocomplete="address-level1" required><option value="">Select state</option></select></div>
    </div>
    <div class="row-two">
      <div><label for="addr_zip">ZIP code</label><input id="addr_zip" type="text" required></div>
      <div><label for="addr_phone">Phone (optional)</label><input id="addr_phone" type="tel"></div>
    </div>
    <label style="display: flex; align-items: center; gap: 8px; font-weight: 500; cursor: pointer;">
      <input id="addr_default" type="checkbox"> Make this my default shipping address
    </label>
    <div class="addr-form-actions">
      <button type="submit" class="addr-form-submit" id="addrSubmitBtn">Save address</button>
      <button type="button" class="addr-form-cancel" id="addrCancelBtn">Cancel</button>
    </div>
  </form>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="/js/supabase-client.js"></script>
<script src="/js/us-states.js"></script>
<script>
(async function() {
  var user = await window.afterslimAuth.requireAuth();
  var supabase = window.afterslimSupabase;
  var profile = null;

  var form = document.getElementById('addrForm');
  var listEl = document.getElementById('addrList');
  var cancelBtn = document.getElementById('addrCancelBtn');
  var formTitle = document.getElementById('addrFormTitle');

  // Populate the State <select> with US states + DC. Sourced from
  // a pipe-delimited string to keep this block compact and editable.
  (function populateStates() {
    var sel = document.getElementById('addr_state');
    if (!sel) return;
    var raw = window.AFTERSLIM_US_STATES || '';
    raw.split('|').forEach(function(pair) {
      if (!pair) return;
      var parts = pair.split(':');
      var opt = document.createElement('option');
      opt.value = parts[0];
      opt.textContent = parts[1];
      sel.appendChild(opt);
    });
  })();

  async function loadAddresses() {
    var [profRes, addrRes] = await Promise.all([
      supabase.from('profiles').select('default_address_id').eq('id', user.id).maybeSingle(),
      supabase.from('addresses').select('*').eq('profile_id', user.id).order('created_at', { ascending: false }),
    ]);
    profile = profRes.data || {};
    var addrs = addrRes.data || [];

    // Auto-import: se tabela `addresses` vazia mas ha orders com shipping_address,
    // importa o endereco mais recente como default. Sem isso, cliente que ja fez
    // checkout via a pagina vazia (porque webhook do admin nao popula addresses
    // hoje — so grava em orders.shipping_address jsonb).
    if (addrs.length === 0) {
      var { data: recentOrder } = await supabase
        .from('orders')
        .select('shipping_address, created_at')
        .eq('profile_id', user.id)
        .not('shipping_address', 'is', null)
        .order('created_at', { ascending: false })
        .limit(1)
        .maybeSingle();
      var sa = recentOrder && recentOrder.shipping_address;
      if (sa && sa.line1) {
        var nameParts = (sa.name || '').split(' ');
        var firstName = nameParts.shift() || '';
        var lastName = nameParts.join(' ') || '';
        var { data: inserted } = await supabase.from('addresses').insert({
          profile_id: user.id,
          first_name: firstName,
          last_name: lastName,
          address_line1: sa.line1,
          address_line2: sa.line2 || null,
          city: sa.city || '',
          state: sa.state || '',
          zip_code: sa.postal_code || '',
          country: sa.country || 'US',
          is_default: true,
        }).select().maybeSingle();
        if (inserted) {
          addrs = [inserted];
          await supabase.from('profiles').update({ default_address_id: inserted.id }).eq('id', user.id);
          profile.default_address_id = inserted.id;
        }
      }
    }

    var defaultId = profile.default_address_id;

    var addBtnHtml = '<button type="button" class="addr-add" data-act="new">'
      + '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>'
      + 'Add a new address'
      + '</button>';
    listEl.innerHTML = addBtnHtml + addrs.map(function(a) {
      var isDefault = a.id === defaultId;
      var fullName = ((a.first_name || '') + ' ' + (a.last_name || '')).trim() || 'Shipping address';
      var actions = '';
      actions += '<button class="addr-btn" data-act="edit" data-id="' + a.id + '">Edit</button>';
      actions += '<span class="sep">|</span>';
      actions += '<button class="addr-btn" data-act="delete" data-id="' + a.id + '">Remove</button>';
      if (!isDefault) {
        actions += '<span class="sep">|</span>';
        actions += '<button class="addr-btn" data-act="default" data-id="' + a.id + '">Set as default</button>';
      }
      return '<article class="addr-card ' + (isDefault ? 'default' : '') + '" data-id="' + a.id + '">'
        + (isDefault
            ? '<div class="addr-default-strip">'
                + '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>'
                + 'Default shipping address'
              + '</div>'
            : '')
        + '<p class="addr-name">' + escapeHtml(fullName) + '</p>'
        + '<div class="addr-body">'
          + '<span class="line">' + escapeHtml(a.address_line1) + '</span>'
          + (a.address_line2 ? '<span class="line">' + escapeHtml(a.address_line2) + '</span>' : '')
          + '<span class="line">' + escapeHtml(a.city) + ', ' + escapeHtml(a.state) + ' ' + escapeHtml(a.zip_code) + '</span>'
          + '<span class="line">' + escapeHtml(a.country || 'United States') + '</span>'
          + (a.phone ? '<span class="line phone">' + escapeHtml(a.phone) + '</span>' : '')
        + '</div>'
        + '<div class="addr-actions">' + actions + '</div>'
      + '</article>';
    }).join('');
  }

  function showForm(addr) {
    form.style.display = 'grid';
    formTitle.textContent = addr ? 'Edit address' : 'Add address';
    document.getElementById('addr_id').value = addr ? addr.id : '';
    document.getElementById('addr_label').value = (addr && addr.label) || '';
    document.getElementById('addr_first').value = (addr && addr.first_name) || '';
    document.getElementById('addr_last').value = (addr && addr.last_name) || '';
    document.getElementById('addr_line1').value = (addr && addr.address_line1) || '';
    document.getElementById('addr_line2').value = (addr && addr.address_line2) || '';
    document.getElementById('addr_city').value = (addr && addr.city) || '';
    document.getElementById('addr_state').value = (addr && addr.state) || '';
    document.getElementById('addr_zip').value = (addr && addr.zip_code) || '';
    document.getElementById('addr_phone').value = (addr && addr.phone) || '';
    document.getElementById('addr_default').checked = !!(addr && addr.is_default);
    form.scrollIntoView({ behavior: 'smooth' });
  }

  function hideForm() { form.style.display = 'none'; }

  cancelBtn.addEventListener('click', hideForm);

  listEl.addEventListener('click', async function(e) {
    var btn = e.target.closest('button[data-act]');
    if (!btn) return;
    var act = btn.getAttribute('data-act');
    var id = btn.getAttribute('data-id');

    if (act === 'new') {
      showForm(null);
      return;
    }
    if (act === 'edit') {
      var { data } = await supabase.from('addresses').select('*').eq('id', id).eq('profile_id', user.id).maybeSingle();
      if (data) showForm(data);
    } else if (act === 'delete') {
      // Guard: se este e o unico endereco E cliente tem sub ativa, bloqueia.
      // Sub sem endereco fica orfa — precisa manter pelo menos um.
      var { data: allAddrs } = await supabase.from('addresses').select('id').eq('profile_id', user.id);
      if ((allAddrs || []).length <= 1) {
        var { data: activeSub } = await supabase
          .from('orders')
          .select('id')
          .eq('profile_id', user.id)
          .not('metadata->>stripe_subscription_id', 'is', null)
          .neq('metadata->>subscription_status', 'canceled')
          .limit(1)
          .maybeSingle();
        if (activeSub) {
          alert("You can't delete your only address while a subscription is active. Add a new one first, or cancel the subscription.");
          return;
        }
      }
      if (!confirm('Delete this address?')) return;
      await supabase.from('addresses').delete().eq('id', id).eq('profile_id', user.id);
      await loadAddresses();
    } else if (act === 'default') {
      await supabase.from('profiles').update({ default_address_id: id }).eq('id', user.id);
      await loadAddresses();
    }
  });

  form.addEventListener('submit', async function(e) {
    e.preventDefault();
    var id = document.getElementById('addr_id').value;
    var payload = {
      profile_id: user.id,
      label: document.getElementById('addr_label').value.trim() || null,
      first_name: document.getElementById('addr_first').value.trim(),
      last_name: document.getElementById('addr_last').value.trim(),
      address_line1: document.getElementById('addr_line1').value.trim(),
      address_line2: document.getElementById('addr_line2').value.trim() || null,
      city: document.getElementById('addr_city').value.trim(),
      state: document.getElementById('addr_state').value.trim().toUpperCase(),
      zip_code: document.getElementById('addr_zip').value.trim(),
      phone: document.getElementById('addr_phone').value.trim() || null,
      country: 'US',
      is_default: document.getElementById('addr_default').checked,
    };

    var saved;
    if (id) {
      var { data, error } = await supabase.from('addresses').update(payload).eq('id', id).select().maybeSingle();
      if (error) { alert(error.message); return; }
      saved = data;
    } else {
      var { data, error } = await supabase.from('addresses').insert(payload).select().maybeSingle();
      if (error) { alert(error.message); return; }
      saved = data;
    }

    if (payload.is_default && saved) {
      await supabase.from('profiles').update({ default_address_id: saved.id }).eq('id', user.id);
    }

    hideForm();
    await loadAddresses();
  });

  await loadAddresses();
})();

function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c) {
    return ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' })[c];
  });
}
</script>
