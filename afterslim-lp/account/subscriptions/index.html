<style>
.sub-card {
  background: var(--bg-2);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 22px;
  margin-bottom: 16px;
}
.sub-card-top {
  display: flex;
  gap: 16px;
  align-items: center;
  margin-bottom: 18px;
  flex-wrap: wrap;
}
.sub-card-img {
  width: 56px; height: 56px;
  background: var(--orange-tint);
  border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  color: var(--orange);
}
.sub-card-title { flex: 1; min-width: 0; }
.sub-card-title h3 { font-size: 17px; font-weight: 800; margin: 0 0 4px; }
.sub-card-title p { font-size: 13.5px; color: var(--ink-2); margin: 0; }
.sub-status {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 4px 10px; border-radius: 999px;
  font-size: 12px; font-weight: 700; text-transform: capitalize;
}
.sub-status[data-s="active"] { background: rgba(22,163,74,0.1); color: #15803d; }
.sub-status[data-s="paused"] { background: rgba(234,179,8,0.12); color: #a16207; }
.sub-status[data-s="cancelled"] { background: rgba(31,20,16,0.08); color: var(--ink-2); }
.sub-status[data-s="past_due"] { background: rgba(220,38,38,0.1); color: #b91c1c; }
.sub-meta-row {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 14px;
  margin-bottom: 18px;
}
@media (max-width: 540px) { .sub-meta-row { grid-template-columns: 1fr 1fr; } }
.sub-meta-label {
  font-size: 11px; font-weight: 700; letter-spacing: 0.8px;
  text-transform: uppercase; color: var(--ink-2);
  margin: 0 0 4px;
}
.sub-meta-value { font-size: 14px; font-weight: 600; color: var(--ink); margin: 0; }

.sub-actions { display: flex; gap: 10px; flex-wrap: wrap; }
.sub-action {
  font-size: 13.5px; font-weight: 600;
  padding: 10px 18px;
  border-radius: 999px;
  background: #fff; color: var(--ink); border: 1px solid var(--line);
  cursor: pointer; font-family: inherit; text-decoration: none;
  transition: border-color 0.15s, color 0.15s;
}
.sub-action:hover { border-color: var(--orange); color: var(--orange); }
.sub-action--danger:hover { border-color: #dc2626; color: #dc2626; }
</style>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="/js/supabase-client.js"></script>
<script>
(async function() {
  var user = await window.afterslimAuth.requireAuth();
  var supabase = window.afterslimSupabase;

  var { data: subs, error } = await supabase
    .from('subscriptions')
    .select('id, status, interval, price_cents, quantity, current_period_start, current_period_end, products(name)')
    .eq('profile_id', user.id)
    .order('created_at', { ascending: false });

  if (error) {
    document.getElementById('subsList').innerHTML =
      '<div class="account-empty"><p>Couldn\'t load your subscriptions. Please refresh or email support@afterslim.com.</p></div>';
    return;
  }

  if (!subs || subs.length === 0) {
    document.getElementById('emptyState').style.display = 'block';
    return;
  }

  var labelMap = { month: 'Every 30 days', bimonth: 'Every 60 days', quarter: 'Every 90 days' };

  var html = subs.map(function(s) {
    var name = (s.products && s.products.name) || 'AfterSlim';
    var nextDate = s.current_period_end
      ? new Date(s.current_period_end).toLocaleDateString('en-US', { year:'numeric', month:'short', day:'numeric' })
      : '—';
    var price = window.formatMoney(s.price_cents);

    var actions = s.status === 'active' || s.status === 'paused'
      ? '<button class="sub-action" data-action="skip" data-sub="' + s.id + '">Skip next</button>'
        + '<button class="sub-action" data-action="frequency" data-sub="' + s.id + '">Change frequency</button>'
        + '<button class="sub-action sub-action--danger" data-action="cancel" data-sub="' + s.id + '">Cancel</button>'
      : (s.status === 'cancelled'
          ? '<a class="sub-action" href="/#bundles">Resubscribe</a>'
          : '<a class="sub-action" href="/account/payment">Update payment</a>');

    return '<article class="sub-card">'
      + '<div class="sub-card-top">'
        + '<div class="sub-card-img"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg></div>'
        + '<div class="sub-card-title">'
          + '<h3>' + escapeHtml(name) + (s.quantity > 1 ? ' &times; ' + s.quantity : '') + '</h3>'
          + '<p>' + (labelMap[s.interval] || s.interval) + ' · ' + price + ' per shipment</p>'
        + '</div>'
        + '<span class="sub-status" data-s="' + s.status + '">' + s.status.replace('_', ' ') + '</span>'
      + '</div>'
      + '<div class="sub-meta-row">'
        + '<div><p class="sub-meta-label">Next shipment</p><p class="sub-meta-value">' + nextDate + '</p></div>'
        + '<div><p class="sub-meta-label">Interval</p><p class="sub-meta-value">' + (labelMap[s.interval] || s.interval) + '</p></div>'
        + '<div><p class="sub-meta-label">Per order</p><p class="sub-meta-value">' + price + '</p></div>'
      + '</div>'
      + '<div class="sub-actions">' + actions + '</div>'
    + '</article>';
  }).join('');

  document.getElementById('subsList').innerHTML = html;

  // Wire actions. All three currently route to support tickets because
  // applying the change to the customer's Stripe subscription needs a
  // server-side endpoint we haven't built yet. Once /api/subscriptions/*
  // exists, swap these for direct calls.
  document.querySelectorAll('.sub-action[data-action]').forEach(function(btn) {
    btn.addEventListener('click', function() {
      var action = btn.getAttribute('data-action');
      var subId = btn.getAttribute('data-sub');
      var subject = action === 'skip' ? 'Skip my next subscription shipment'
                  : action === 'frequency' ? 'Change my subscription frequency'
                  : 'Cancel my subscription';
      window.location.href = '/account/tickets/new?subject=' + encodeURIComponent(subject) + '&sub=' + subId;
    });
  });
})();

function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c) {
    return ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' })[c];
  });
}
</script>
