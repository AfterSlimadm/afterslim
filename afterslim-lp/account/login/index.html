    <div class="auth-logo"><img src="/images/logo-afterslim-tight.png" alt="AfterSlim"></div>

    <p class="auth-lede">Welcome back. Sign in to manage subscriptions, view orders, and open support tickets.</p>

    <div id="authError" class="auth-error" style="display: none;"></div>

      <span>Continue with Google</span>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

<script>
(async function() {
  await window.afterslimAuth.redirectIfAuthed();

  var btn = document.getElementById('googleBtn');
  var errBox = document.getElementById('authError');

  btn.addEventListener('click', async function() {
    errBox.style.display = 'none';
    btn.disabled = true;
    btn.classList.add('is-loading');

    var params = new URLSearchParams(window.location.search);
    var next = params.get('next') || '/account';
    var redirectTo = window.location.origin + next;

    var { error } = await window.afterslimAuth.signInWithGoogle(redirectTo);
    if (error) {
      errBox.textContent = error.message || 'Sign in failed. Please try again.';
      errBox.style.display = 'block';
      btn.disabled = false;
      btn.classList.remove('is-loading');
    }
  });
})();
</script>
