<header class="auth-nav">
  <a href="/" aria-label="AfterSlim home"><img src="/images/logo-afterslim-tight.png" alt="AfterSlim"></a>
</header>

<main class="auth-shell">
  <div class="auth-card">
    <h1>Sign in</h1>
    <p class="auth-lede">Welcome back. Manage subscriptions, view orders, and open support tickets.</p>

    <div id="authError" class="auth-error" style="display: none;"></div>

    <div id="g_id_onload"
      data-client_id="306360274988-8t7r8lb0hmqf6if4kdc0bl58ch9pbbf1.apps.googleusercontent.com"
      data-context="signin"
      data-ux_mode="popup"
      data-callback="afterslimGoogleCredential"
      data-auto_prompt="true"
      data-itp_support="true"
      data-locale="en"></div>

    <div class="g_id_signin"
      data-type="standard"
      data-shape="pill"
      data-theme="outline"
      data-text="continue_with"
      data-size="large"
      data-logo_alignment="left"
      data-locale="en"></div>

    <div class="auth-divider">or</div>

    <form class="auth-form" id="emailLoginForm" novalidate>
      <div class="auth-field">
        <label for="loginEmail">Email</label>
        <input type="email" id="loginEmail" name="email" autocomplete="email" required>
      </div>
      <div class="auth-field">
        <label for="loginPassword">Password</label>
        <input type="password" id="loginPassword" name="password" autocomplete="current-password" required minlength="8">
      </div>
      <div class="auth-field-row">
        <a href="/account/forgot-password">Forgot password?</a>
      </div>
      <button type="submit" class="auth-submit" id="loginSubmit">Sign in</button>
    </form>

    <p class="auth-meta">New to AfterSlim? <a href="/account/signup">Create an account</a></p>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="/js/supabase-client.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
(async function() {
  await window.afterslimAuth.redirectIfAuthed();
})();

function afterslimNextUrl() {
  var params = new URLSearchParams(window.location.search);
  return params.get('next') || '/account';
}

window.afterslimGoogleCredential = async function(response) {
  var errBox = document.getElementById('authError');
  errBox.style.display = 'none';
  var { error } = await window.afterslimSupabase.auth.signInWithIdToken({
    provider: 'google',
    token: response.credential,
  });
  if (error) {
    errBox.textContent = error.message || 'Sign in failed. Please try again.';
    errBox.style.display = 'block';
    return;
  }
  window.location.href = afterslimNextUrl();
};

document.getElementById('emailLoginForm').addEventListener('submit', async function(ev) {
  ev.preventDefault();
  var errBox = document.getElementById('authError');
  var btn = document.getElementById('loginSubmit');
  var email = document.getElementById('loginEmail').value.trim();
  var password = document.getElementById('loginPassword').value;
  errBox.style.display = 'none';
  if (!email || !password) {
    errBox.textContent = 'Please enter your email and password.';
    errBox.style.display = 'block';
    return;
  }
  btn.disabled = true;
  btn.textContent = 'Signing in...';
  var { error } = await window.afterslimSupabase.auth.signInWithPassword({ email: email, password: password });
  if (error) {
    btn.disabled = false;
    btn.textContent = 'Sign in';
    var msg = (error.message || '').toLowerCase();
    if (msg.indexOf('invalid') !== -1) {
      errBox.textContent = "Couldn't sign you in. Check your email and password, or reset it below.";
    } else if (msg.indexOf('confirm') !== -1) {
      errBox.textContent = 'Please confirm your email first. Check your inbox for the confirmation link.';
    } else {
      errBox.textContent = error.message || 'Sign in failed. Please try again.';
    }
    errBox.style.display = 'block';
    return;
  }
  window.location.href = afterslimNextUrl();
});
</script>

</body>
