<style>
body { background: #ffffff; }

/* Hero centralizado com titulo grande e gradiente escuro→laranja no estilo
   da secao problems da LP. Reforca visualmente que a acao (review) e um
   momento de compartilhamento, nao mais um item de menu. */
.rv-hero {
  text-align: center;
  padding: 32px 0 28px;
  margin: 0 0 24px;
}
.rv-hero h1 {
  font-size: clamp(32px, 5vw, 52px);
  font-weight: 800;
  line-height: 1.1;
  letter-spacing: -0.02em;
  margin: 0;
  color: #0f1111;
}
.rv-hero .g1 {
  background: linear-gradient(135deg, #0f1111 40%, #ea580c 100%);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
}
.rv-hero .g2 {
  color: #ea580c;
}

.rv-section { margin-bottom: 40px; }
.rv-section h2 {
  font-size: 20px; font-weight: 700; color: var(--ink); margin: 0 0 4px;
}
.rv-section-sub { font-size: 14px; color: var(--ink-2); margin: 0 0 18px; }

.rv-pending-list, .rv-mine-list { display: grid; gap: 14px; }

.rv-card {
  background: #fff; border: 1px solid var(--line); border-radius: 12px;
  padding: 18px 20px;
  display: flex; align-items: center; gap: 16px;
}
.rv-card-thumb {
  width: 64px; height: 64px; flex-shrink: 0;
  background: #f5f5f4; border-radius: 8px; overflow: hidden;
}
.rv-card-thumb img { width: 100%; height: 100%; object-fit: cover; }
.rv-card-body { flex: 1; min-width: 0; }
.rv-card-title { font-weight: 600; font-size: 15px; color: var(--ink); margin: 0 0 2px; }
.rv-card-meta { font-size: 13px; color: var(--ink-2); margin: 0; }
.rv-card-cta {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 8px 16px; border-radius: 8px; border: 0;
  background: var(--orange); color: #fff;
  font-family: inherit; font-size: 13.5px; font-weight: 600;
  cursor: pointer; text-decoration: none;
}
.rv-card-cta:hover { background: var(--orange-dark); }

.rv-mine-card { flex-direction: column; align-items: stretch; }
.rv-mine-head {
  display: flex; justify-content: space-between; align-items: flex-start;
  gap: 12px;
}
.rv-mine-stars { display: flex; gap: 2px; }
.rv-star { width: 15px; height: 15px; color: #e5e7eb; }
.rv-star.on { color: #f59e0b; fill: #f59e0b; }
.rv-mine-actions { display: flex; gap: 6px; }
.rv-mine-actions button {
  background: none; border: 0; color: var(--ink-2);
  font-size: 12.5px; font-weight: 500; cursor: pointer;
  padding: 4px 8px; border-radius: 6px;
  font-family: inherit;
}
.rv-mine-actions button:hover { background: #f5f5f4; color: var(--ink); }
.rv-mine-actions button.rv-danger:hover { background: #fef2f2; color: #b91c1c; }
.rv-mine-title { font-weight: 600; font-size: 15px; margin: 8px 0 4px; color: var(--ink); }
.rv-mine-body { font-size: 14px; line-height: 1.55; color: var(--ink); margin: 0; }
.rv-mine-media {
  display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px;
}
.rv-mine-media-btn {
  background: none; border: 0; padding: 0; cursor: zoom-in;
}
.rv-mine-media img {
  width: 80px; height: 80px; object-fit: cover;
  border-radius: 8px; border: 1px solid var(--line);
  transition: border-color 0.15s;
}
.rv-mine-media-btn:hover img { border-color: var(--orange); }

/* Lightbox — mesmo padrao da LP publica */
.rv-lightbox {
  position: fixed; inset: 0; background: rgba(0,0,0,0.85);
  display: flex; align-items: center; justify-content: center;
  z-index: 10000; padding: 20px; cursor: zoom-out;
}
.rv-lightbox img {
  max-width: min(1100px, 95vw); max-height: 90vh;
  border-radius: 8px; box-shadow: 0 30px 60px rgba(0,0,0,0.5);
}
.rv-lightbox-close {
  position: absolute; top: 20px; right: 24px;
  background: rgba(255,255,255,0.15); color: #fff;
  border: 0; width: 40px; height: 40px; border-radius: 50%;
  font-size: 24px; line-height: 1; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}
.rv-lightbox-close:hover { background: rgba(255,255,255,0.25); }
.rv-mine-date { font-size: 12px; color: var(--ink-2); margin-top: 8px; }
.rv-mine-hidden-note {
  margin-top: 10px; padding: 8px 12px;
  background: #fefce8; border: 1px solid #fde68a; border-radius: 8px;
  font-size: 12.5px; color: #78350f;
}
.rv-mine-reply {
  margin-top: 12px; padding: 12px;
  background: var(--tint); border-radius: 8px;
  border-left: 3px solid var(--orange);
}
.rv-mine-reply-label {
  font-size: 12px; font-weight: 600; color: var(--orange-dark);
  text-transform: uppercase; letter-spacing: 0.4px; margin: 0 0 4px;
}
.rv-mine-reply-body { font-size: 13.5px; line-height: 1.5; color: var(--ink); margin: 0; }

.rv-empty {
  padding: 40px 20px; text-align: center;
  background: #fafaf9; border: 1px dashed var(--line); border-radius: 12px;
  color: var(--ink-2); font-size: 14px;
}
.rv-empty strong { color: var(--ink); display: block; margin-bottom: 6px; }

/* Modal */
.rv-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.5);
  display: flex; align-items: center; justify-content: center;
  padding: 20px; z-index: 100;
}
.rv-modal {
  background: #fff; border-radius: 14px; padding: 28px;
  max-width: 480px; width: 100%; max-height: 90vh; overflow-y: auto;
  box-shadow: 0 20px 50px rgba(0,0,0,0.2);
}
.rv-modal h3 { margin: 0 0 6px; font-size: 20px; font-weight: 700; color: var(--ink); }
.rv-modal-sub { margin: 0 0 20px; font-size: 14px; color: var(--ink-2); }
.rv-form-label {
  display: block; font-size: 13px; font-weight: 600;
  color: var(--ink); margin-bottom: 6px;
}
.rv-form-field { margin-bottom: 16px; }
.rv-form input, .rv-form textarea {
  width: 100%; font-family: inherit; font-size: 14.5px;
  background: #fff; border: 1px solid var(--line); border-radius: 8px;
  padding: 10px 12px; outline: 0; resize: vertical;
}
.rv-form input:focus, .rv-form textarea:focus {
  border-color: var(--orange); box-shadow: 0 0 0 3px rgba(234,88,12,0.12);
}
.rv-star-picker { display: flex; gap: 4px; }
.rv-star-picker button {
  background: none; border: 0; cursor: pointer; padding: 2px;
  color: #e5e7eb; transition: color 0.1s;
}
.rv-star-picker button.on { color: #f59e0b; }
.rv-star-picker svg { width: 28px; height: 28px; fill: currentColor; }
.rv-form-actions { display: flex; align-items: center; gap: 14px; margin-top: 20px; }
.rv-btn-submit {
  background: var(--orange); color: #fff;
  font-family: inherit; font-size: 14px; font-weight: 600;
  padding: 10px 20px; border-radius: 8px; border: 0; cursor: pointer;
}
.rv-btn-submit:hover { background: var(--orange-dark); }
.rv-btn-submit:disabled { opacity: 0.5; cursor: wait; }
.rv-btn-cancel {
  background: none; border: 0; padding: 0;
  color: var(--ink-2); font-family: inherit; font-size: 14px; font-weight: 500;
  cursor: pointer;
}
.rv-form-status { font-size: 13px; padding: 8px 0; }
.rv-form-status.err { color: #b91c1c; }

.rv-media-grid {
  display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px;
}
.rv-media-grid:empty { display: none; }
.rv-media-thumb {
  position: relative; width: 80px; height: 80px;
  border-radius: 8px; overflow: hidden;
  border: 1px solid var(--line);
  background: #f5f5f4;
}
.rv-media-thumb img { width: 100%; height: 100%; object-fit: cover; }
.rv-media-thumb.uploading {
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; color: var(--ink-2);
}
.rv-media-thumb-remove {
  position: absolute; top: 4px; right: 4px;
  width: 20px; height: 20px; border-radius: 50%;
  background: rgba(0,0,0,0.7); color: #fff;
  border: 0; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; line-height: 1; padding: 0;
}
.rv-media-thumb-remove:hover { background: #000; }
.rv-media-add {
  background: none; border: 1px dashed var(--line); color: var(--ink-2);
  padding: 8px 14px; border-radius: 8px;
  font-family: inherit; font-size: 13px; font-weight: 500;
  cursor: pointer;
}
.rv-media-add:hover { border-color: var(--orange); color: var(--orange); }
.rv-media-add:disabled { opacity: 0.5; cursor: not-allowed; }
</style>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="/js/supabase-client.js"></script>
<script>
(async function() {
  var user = await window.afterslimAuth.requireAuth();
  var supabase = window.afterslimSupabase;

  // Endpoint do admin. Local em dev, prod caso contrario.
  var API_BASE = (location.hostname === 'localhost' || location.hostname === '127.0.0.1')
    ? 'http://localhost:3456'
    : 'https://admin.afterslim.com';

  var pendingEl = document.getElementById('rvPending');
  var mineEl = document.getElementById('rvMine');

  function starsHtml(n) {
    var out = '<div class="rv-mine-stars">';
    for (var i = 1; i <= 5; i++) {
      out += '<svg class="rv-star ' + (i <= n ? 'on' : '') + '" viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M12 17.27 18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>';
    }
    return out + '</div>';
  }

  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c) {
      return ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' })[c];
    });
  }

  async function loadAll() {
    // 1) Reviews que o cliente ja escreveu
    var { data: mine } = await supabase
      .from('product_reviews')
      .select('*')
      .eq('profile_id', user.id)
      .order('created_at', { ascending: false });
    mine = mine || [];

    // 2) Orders delivered — pra saber quais produtos podem ser reviewed
    var { data: deliveredOrders } = await supabase
      .from('orders')
      .select('id, order_number, delivered_at, order_items(product_id, product_name, product_image)')
      .eq('profile_id', user.id)
      .eq('status', 'delivered')
      .order('delivered_at', { ascending: false });
    deliveredOrders = deliveredOrders || [];

    // Flatten pra { product_id, order_id, product_name, image, delivered_at }
    // dedupe por product_id (mais recente ganha)
    var reviewedProductIds = new Set(mine.filter(function(r) { return r.product_id; }).map(function(r) { return r.product_id; }));
    var seenProducts = new Set();
    var pending = [];
    for (var i = 0; i < deliveredOrders.length; i++) {
      var o = deliveredOrders[i];
      var items = o.order_items || [];
      for (var j = 0; j < items.length; j++) {
        var it = items[j];
        if (!it.product_id) continue;
        if (reviewedProductIds.has(it.product_id)) continue;
        if (seenProducts.has(it.product_id)) continue;
        seenProducts.add(it.product_id);
        pending.push({
          product_id: it.product_id,
          order_id: o.id,
          order_number: o.order_number,
          product_name: it.product_name,
          product_image: it.product_image,
          delivered_at: o.delivered_at,
        });
      }
    }

    // Fallback pra imagem: single-product store, imagem do bottle e conhecida.
    // Se order_items.product_image estiver preenchida, usa; senao cai pro
    // asset padrao (mesmo que aparece na LP hero).
    var DEFAULT_PRODUCT_IMAGE = '/images/afterslim-bottle-transparent.png';

    // Render pending
    if (pending.length === 0) {
      pendingEl.innerHTML = '<div class="rv-empty">'
        + '<strong>Nothing to review yet.</strong>'
        + 'Once your order is delivered, it\'ll show up here for you to share your experience.'
        + '</div>';
    } else {
      pendingEl.innerHTML = pending.map(function(p) {
        var imgSrc = p.product_image || DEFAULT_PRODUCT_IMAGE;
        return '<div class="rv-card">'
          + '<div class="rv-card-thumb"><img src="' + escapeHtml(imgSrc) + '" alt=""></div>'
          + '<div class="rv-card-body">'
            + '<p class="rv-card-title">' + escapeHtml(p.product_name) + '</p>'
            + '<p class="rv-card-meta">Delivered ' + (p.delivered_at ? new Date(p.delivered_at).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) : '') + ' · Order ' + escapeHtml(p.order_number) + '</p>'
          + '</div>'
          + '<button class="rv-card-cta" data-act="write" data-pid="' + p.product_id + '" data-oid="' + p.order_id + '" data-pname="' + escapeHtml(p.product_name) + '">Write a review</button>'
        + '</div>';
      }).join('');
    }

    // Render mine
    if (mine.length === 0) {
      mineEl.innerHTML = '<div class="rv-empty">'
        + '<strong>No reviews yet.</strong>'
        + 'When you review a product, it shows up here so you can edit or remove it later.'
        + '</div>';
    } else {
      mineEl.innerHTML = mine.map(function(r) {
        // Nada de "esta review nao esta visivel" ou "aguardando aprovacao":
        // moderacao silenciosa. Cliente ve como se estivesse publicada, sempre.
        var replyBlock = r.admin_reply
          ? '<div class="rv-mine-reply">'
              + '<p class="rv-mine-reply-label">Response from AfterSlim</p>'
              + '<p class="rv-mine-reply-body">' + escapeHtml(r.admin_reply) + '</p>'
            + '</div>'
          : '';
        return '<article class="rv-card rv-mine-card">'
          + '<div class="rv-mine-head">'
            + starsHtml(r.rating)
            + '<div class="rv-mine-actions">'
              + '<button data-act="edit" data-id="' + r.id + '">Edit</button>'
              + '<button data-act="delete" data-id="' + r.id + '" class="rv-danger">Delete</button>'
            + '</div>'
          + '</div>'
          + (r.title ? '<p class="rv-mine-title">' + escapeHtml(r.title) + '</p>' : '')
          + (r.body ? '<p class="rv-mine-body">' + escapeHtml(r.body) + '</p>' : '')
          + (Array.isArray(r.media_urls) && r.media_urls.length
              ? '<div class="rv-mine-media">' + r.media_urls.map(function(u) {
                  return '<button type="button" class="rv-mine-media-btn" data-rl-full="' + escapeHtml(u) + '"><img src="' + escapeHtml(u) + '" alt=""></button>';
                }).join('') + '</div>'
              : '')
          + '<p class="rv-mine-date">' + new Date(r.created_at).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) + '</p>'
          + replyBlock
        + '</article>';
      }).join('');
    }

    // Cache pra edit
    window._reviewsById = {};
    mine.forEach(function(r) { window._reviewsById[r.id] = r; });
  }

  function openModal(mode, ctx) {
    // mode = 'create' (ctx: {product_id, order_id, product_name}) | 'edit' (ctx: review)
    var existing = document.getElementById('rvOverlay');
    if (existing) existing.remove();

    var isEdit = mode === 'edit';
    var rating = isEdit ? ctx.rating : 5;
    var title = isEdit ? (ctx.title || '') : '';
    var body = isEdit ? (ctx.body || '') : '';
    var titleTxt = isEdit ? 'Edit your review' : 'Review this product';
    var subTxt = isEdit ? '' : ctx.product_name;
    var currentMedia = (isEdit && Array.isArray(ctx.media_urls)) ? ctx.media_urls.slice() : [];
    var MAX_MEDIA = 3;

    var starsPickerHtml = '';
    for (var i = 5; i >= 1; i--) {
      starsPickerHtml = '<button type="button" data-rv-star="' + i + '" ' + (i <= rating ? 'class="on"' : '') + '>'
        + '<svg viewBox="0 0 24 24"><path d="M12 17.27 18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>'
        + '</button>' + starsPickerHtml;
    }

    var html = '<div class="rv-overlay" id="rvOverlay">'
      + '<div class="rv-modal">'
        + '<h3>' + escapeHtml(titleTxt) + '</h3>'
        + (subTxt ? '<p class="rv-modal-sub">' + escapeHtml(subTxt) + '</p>' : '')
        + '<form class="rv-form" id="rvForm">'
          + '<div class="rv-form-field">'
            + '<label class="rv-form-label">Rating</label>'
            + '<div class="rv-star-picker" id="rvStarPicker">' + starsPickerHtml + '</div>'
            + '<input type="hidden" id="rvRating" value="' + rating + '">'
          + '</div>'
          + '<div class="rv-form-field">'
            + '<label class="rv-form-label" for="rvTitle">Title (optional)</label>'
            + '<input id="rvTitle" type="text" maxlength="120" value="' + escapeHtml(title) + '">'
          + '</div>'
          + '<div class="rv-form-field">'
            + '<label class="rv-form-label" for="rvBody">Your review (optional)</label>'
            + '<textarea id="rvBody" rows="5" maxlength="4000">' + escapeHtml(body) + '</textarea>'
          + '</div>'
          + '<div class="rv-form-field">'
            + '<label class="rv-form-label">Photos (optional, up to ' + MAX_MEDIA + ')</label>'
            + '<div class="rv-media-grid" id="rvMediaGrid"></div>'
            + '<input type="file" id="rvMediaInput" accept="image/*" multiple style="display:none">'
            + '<button type="button" class="rv-media-add" id="rvMediaAdd">+ Add photo</button>'
          + '</div>'
          + '<div class="rv-form-status" id="rvStatus" style="display:none"></div>'
          + '<div class="rv-form-actions">'
            + '<button type="submit" class="rv-btn-submit" id="rvSubmit">' + (isEdit ? 'Save changes' : 'Submit review') + '</button>'
            + '<button type="button" class="rv-btn-cancel" id="rvCancel">Cancel</button>'
          + '</div>'
        + '</form>'
      + '</div>'
    + '</div>';
    document.body.insertAdjacentHTML('beforeend', html);

    var overlay = document.getElementById('rvOverlay');
    document.getElementById('rvCancel').addEventListener('click', function() { overlay.remove(); });
    overlay.addEventListener('click', function(e) { if (e.target === overlay) overlay.remove(); });

    // Star picker: click grava o valor e pinta 1..N. Sem hover preview —
    // usuario prefere feedback so ao clicar (padrao TripAdvisor/Yelp).
    var picker = document.getElementById('rvStarPicker');
    var ratingInput = document.getElementById('rvRating');

    function paintStars(n) {
      picker.querySelectorAll('button').forEach(function(b) {
        var bv = parseInt(b.getAttribute('data-rv-star'), 10);
        b.classList.toggle('on', bv <= n);
      });
    }

    picker.querySelectorAll('button[data-rv-star]').forEach(function(btn) {
      var v = parseInt(btn.getAttribute('data-rv-star'), 10);
      btn.addEventListener('click', function() {
        ratingInput.value = v;
        paintStars(v);
      });
    });

    // Media upload — vai direto pro bucket 'review-media' via supabase-js.
    // Path: reviews/{profile_id}/{timestamp}-{safe_filename}. RLS restringe
    // uploads pra o proprio profile_id no auth.uid(), entao nao da pra
    // upar no path do outro.
    var mediaGrid = document.getElementById('rvMediaGrid');
    var mediaInput = document.getElementById('rvMediaInput');
    var mediaAddBtn = document.getElementById('rvMediaAdd');

    function renderMediaGrid() {
      mediaGrid.innerHTML = currentMedia.map(function(url, idx) {
        return '<div class="rv-media-thumb">'
          + '<img src="' + escapeHtml(url) + '" alt="">'
          + '<button type="button" class="rv-media-thumb-remove" data-rv-media-idx="' + idx + '" aria-label="Remove">×</button>'
        + '</div>';
      }).join('');
      mediaAddBtn.disabled = currentMedia.length >= MAX_MEDIA;
      mediaAddBtn.textContent = currentMedia.length >= MAX_MEDIA
        ? 'Photo limit reached'
        : '+ Add photo';
    }

    mediaGrid.addEventListener('click', function(e) {
      var btn = e.target.closest('button[data-rv-media-idx]');
      if (!btn) return;
      var idx = parseInt(btn.getAttribute('data-rv-media-idx'), 10);
      currentMedia.splice(idx, 1);
      renderMediaGrid();
    });

    mediaAddBtn.addEventListener('click', function() { mediaInput.click(); });

    mediaInput.addEventListener('change', async function() {
      var files = Array.from(mediaInput.files || []);
      mediaInput.value = '';
      if (!files.length) return;

      var slots = MAX_MEDIA - currentMedia.length;
      if (slots <= 0) return;
      files = files.slice(0, slots);

      // Placeholder "uploading" pra dar feedback imediato
      var uploadingHtml = files.map(function() {
        return '<div class="rv-media-thumb uploading">Uploading…</div>';
      }).join('');
      mediaGrid.insertAdjacentHTML('beforeend', uploadingHtml);
      mediaAddBtn.disabled = true;

      try {
        for (var i = 0; i < files.length; i++) {
          var f = files[i];
          if (f.size > 5 * 1024 * 1024) {
            alert('Image too large (max 5MB): ' + f.name);
            continue;
          }
          var safeName = f.name.replace(/[^a-zA-Z0-9._-]/g, '_');
          var path = 'reviews/' + user.id + '/' + Date.now() + '-' + i + '-' + safeName;
          var { error: upErr } = await supabase.storage
            .from('review-media').upload(path, f, { contentType: f.type, upsert: false });
          if (upErr) {
            console.error('[review upload] failed:', upErr.message);
            alert('Upload failed: ' + upErr.message);
            continue;
          }
          var { data: pub } = supabase.storage.from('review-media').getPublicUrl(path);
          if (pub && pub.publicUrl) currentMedia.push(pub.publicUrl);
        }
      } catch (err) {
        console.error('[review upload] unexpected:', err);
        alert('Upload error. Try again.');
      }
      renderMediaGrid();
    });

    // Estado inicial da grid (edit mode traz medias existentes)
    renderMediaGrid();

    document.getElementById('rvForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      var submitBtn = document.getElementById('rvSubmit');
      var statusEl = document.getElementById('rvStatus');
      submitBtn.disabled = true;
      submitBtn.textContent = 'Saving...';
      statusEl.style.display = 'none';

      try {
        var session = await window.afterslimAuth.session();
        var token = session && session.access_token;
        if (!token) throw new Error('Please sign in again.');

        var payload = {
          rating: parseInt(document.getElementById('rvRating').value, 10) || 5,
          title: document.getElementById('rvTitle').value.trim(),
          body: document.getElementById('rvBody').value.trim(),
          media_urls: currentMedia,
        };

        var url, method;
        if (isEdit) {
          url = API_BASE + '/api/reviews/' + ctx.id;
          method = 'PATCH';
        } else {
          url = API_BASE + '/api/reviews';
          method = 'POST';
          payload.product_id = ctx.product_id;
          payload.order_id = ctx.order_id;
        }

        var res = await fetch(url, {
          method: method,
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + token,
          },
          body: JSON.stringify(payload),
        });
        var json = await res.json();
        if (!res.ok) throw new Error(json.error || 'Failed to save review.');

        overlay.remove();
        await loadAll();
      } catch (err) {
        statusEl.style.display = 'block';
        statusEl.className = 'rv-form-status err';
        statusEl.textContent = err.message || 'Something went wrong.';
        submitBtn.disabled = false;
        submitBtn.textContent = isEdit ? 'Save changes' : 'Submit review';
      }
    });
  }

  document.body.addEventListener('click', async function(e) {
    var btn = e.target.closest('button[data-act]');
    if (!btn) return;
    var act = btn.getAttribute('data-act');

    if (act === 'write') {
      openModal('create', {
        product_id: btn.getAttribute('data-pid'),
        order_id: btn.getAttribute('data-oid'),
        product_name: btn.getAttribute('data-pname'),
      });
      return;
    }
    if (act === 'edit') {
      var id = btn.getAttribute('data-id');
      var r = window._reviewsById && window._reviewsById[id];
      if (r) openModal('edit', r);
      return;
    }
    if (act === 'delete') {
      var id2 = btn.getAttribute('data-id');
      openDeleteConfirm(id2);
    }
  });

  // Modal customizado de confirmacao de delete. Substitui o confirm()
  // nativo do browser que ficava feio + fora do estilo da conta.
  function openDeleteConfirm(reviewId) {
    var existing = document.getElementById('rvDeleteOverlay');
    if (existing) existing.remove();
    var html = '<div class="rv-overlay" id="rvDeleteOverlay">'
      + '<div class="rv-modal" style="max-width:400px">'
        + '<h3>Delete this review?</h3>'
        + '<p class="rv-modal-sub">This cannot be undone.</p>'
        + '<div class="rv-form-status" id="rvDeleteStatus" style="display:none"></div>'
        + '<div class="rv-form-actions" style="justify-content:flex-end;">'
          + '<button type="button" class="rv-btn-cancel" id="rvDeleteCancel">Cancel</button>'
          + '<button type="button" class="rv-btn-submit" id="rvDeleteConfirm" style="background:#b91c1c">Delete review</button>'
        + '</div>'
      + '</div>'
    + '</div>';
    document.body.insertAdjacentHTML('beforeend', html);
    var overlay = document.getElementById('rvDeleteOverlay');
    var confirmBtn = document.getElementById('rvDeleteConfirm');
    var cancelBtn = document.getElementById('rvDeleteCancel');
    var statusEl = document.getElementById('rvDeleteStatus');

    function close() { overlay.remove(); }
    cancelBtn.addEventListener('click', close);
    overlay.addEventListener('click', function(e) { if (e.target === overlay) close(); });

    confirmBtn.addEventListener('click', async function() {
      confirmBtn.disabled = true;
      cancelBtn.disabled = true;
      confirmBtn.textContent = 'Deleting...';
      statusEl.style.display = 'none';
      try {
        var session = await window.afterslimAuth.session();
        var token = session && session.access_token;
        var res = await fetch(API_BASE + '/api/reviews/' + reviewId, {
          method: 'DELETE',
          headers: { 'Authorization': 'Bearer ' + token },
        });
        if (!res.ok) throw new Error('Failed to delete review.');
        close();
        await loadAll();
      } catch (err) {
        statusEl.style.display = 'block';
        statusEl.className = 'rv-form-status err';
        statusEl.textContent = err.message || 'Failed to delete review.';
        confirmBtn.disabled = false;
        cancelBtn.disabled = false;
        confirmBtn.textContent = 'Delete review';
      }
    });
  }

  // Lightbox: click em thumb abre imagem em popup. Fecha em qualquer click
  // ou Esc. Delegado no body pra pegar tanto reviews atuais quanto qualquer
  // re-render depois de edit/create.
  document.body.addEventListener('click', function(e) {
    var trigger = e.target.closest('[data-rl-full]');
    if (!trigger) return;
    e.preventDefault();
    var url = trigger.getAttribute('data-rl-full');
    // So http(s); e img.src via propriedade (nao innerHTML) pra evitar XSS
    // por quebra de atributo — getAttribute retorna valor decodificado.
    if (!/^https?:\/\//i.test(url)) return;
    var existing = document.getElementById('rvLightbox');
    if (existing) existing.remove();
    var box = document.createElement('div');
    box.className = 'rv-lightbox';
    box.id = 'rvLightbox';
    var closeBtn = document.createElement('button');
    closeBtn.type = 'button';
    closeBtn.className = 'rv-lightbox-close';
    closeBtn.setAttribute('aria-label', 'Close');
    closeBtn.textContent = '×';
    var lbImg = document.createElement('img');
    lbImg.src = url;
    lbImg.alt = '';
    box.appendChild(closeBtn);
    box.appendChild(lbImg);
    document.body.appendChild(box);
    document.body.style.overflow = 'hidden';
    function close() {
      box.remove();
      document.body.style.overflow = '';
      document.removeEventListener('keydown', onKey);
    }
    function onKey(ev) { if (ev.key === 'Escape') close(); }
    box.addEventListener('click', close);
    document.addEventListener('keydown', onKey);
  });

  await loadAll();
})();
</script>

</body>
</html>
