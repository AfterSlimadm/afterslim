<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your Orders — AfterSlim</title>
<meta name="description" content="View and manage your AfterSlim orders.">
<link rel="icon" href="/favicon.ico">
<link rel="stylesheet" href="/styles/policy.css">
<link rel="stylesheet" href="/styles/account.css">
<style>html[data-auth=pending] body{visibility:hidden}</style>
<script>document.documentElement.dataset.auth='pending';</script>
<style>
.order-card {
  background: var(--bg-2);
  border: 1px solid var(--line);
  border-radius: 14px;
  margin-bottom: 16px;
  overflow: hidden;
}
.order-card-header {
  display: grid;
  grid-template-columns: repeat(4, 1fr) auto;
  gap: 16px;
  padding: 16px 20px;
  background: rgba(255, 248, 240, 0.6);
  border-bottom: 1px solid var(--line);
  align-items: center;
}
.order-meta-label {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.8px;
  text-transform: uppercase;
  color: var(--ink-2);
  margin: 0 0 2px;
}
.order-meta-value { font-size: 13.5px; color: var(--ink); font-weight: 600; }
.order-card-body { padding: 18px 20px; }
.order-status {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 700;
  text-transform: capitalize;
}
.order-status[data-s="pending"], .order-status[data-s="paid"] { background: rgba(234,88,12,0.1); color: var(--orange-dark); }
.order-status[data-s="processing"] { background: rgba(59,130,246,0.1); color: #1e40af; }
.order-status[data-s="shipped"] { background: rgba(168,85,247,0.12); color: #6b21a8; }
.order-status[data-s="delivered"] { background: rgba(22,163,74,0.1); color: #15803d; }
.order-status[data-s="cancelled"], .order-status[data-s="refunded"] { background: rgba(31,20,16,0.08); color: var(--ink-2); }

.order-items { display: flex; flex-direction: column; gap: 10px; }
.order-item {
  display: flex;
  gap: 14px;
  align-items: center;
}
.order-item-img {
  width: 64px; height: 64px;
  background: var(--orange-tint);
  border-radius: 10px;
  overflow: hidden;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}
.order-item-img img { max-width: 100%; max-height: 100%; }
.order-item-info { flex: 1; min-width: 0; }
.order-item-name { font-size: 14.5px; font-weight: 600; margin: 0 0 2px; }
.order-item-meta { font-size: 13px; color: var(--ink-2); margin: 0; }

.order-card-actions {
  padding: 14px 20px;
  background: rgba(255,248,240,0.4);
  border-top: 1px solid var(--line);
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}
.order-action {
  font-size: 13.5px;
  font-weight: 600;
  padding: 8px 16px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: #fff;
  color: var(--ink);
  text-decoration: none;
  cursor: pointer;
  font-family: inherit;
  transition: border-color 0.15s, color 0.15s;
}
.order-action:hover { border-color: var(--orange); color: var(--orange); }

@media (max-width: 640px) {
  .order-card-header { grid-template-columns: 1fr 1fr; gap: 12px; }
}
</style>
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <a href="/account" class="nav-back" aria-label="Back to account">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
      Account
    </a>
    <a href="/" class="nav-logo" aria-label="AfterSlim home"><img src="/images/logo-afterslim-tight.png" alt="AfterSlim"></a>
    <span style="width: 64px;"></span>
  </div>
</nav>

<main class="account-page">
  <a href="/account" class="account-page-back">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
    Back to account
  </a>
  <h1>Your orders</h1>
  <p class="account-page-lede">A full history of your purchases. Click any order to see tracking, items, and request a return.</p>

  <div id="ordersList"></div>

  <div id="emptyState" class="account-empty" style="display: none;">
    <p>You haven't placed any orders yet.</p>
    <a class="account-empty-cta" href="/#bundles">Browse AfterSlim
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
    </a>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="/js/supabase-client.js"></script>
<script>
(async function() {
  var user = await window.afterslimAuth.requireAuth();
  var supabase = window.afterslimSupabase;

  var { data: orders, error } = await supabase
    .from('orders')
    .select('id, order_number, status, total_cents, tracking_number, tracking_url, created_at, order_items(product_name, product_image, quantity, unit_price_cents)')
    .eq('profile_id', user.id)
    .order('created_at', { ascending: false });

  if (error) {
    document.getElementById('ordersList').innerHTML =
      '<div class="account-empty"><p>Couldn\'t load your orders. Please refresh or email support@afterslim.com.</p></div>';
    return;
  }

  if (!orders || orders.length === 0) {
    document.getElementById('emptyState').style.display = 'block';
    return;
  }

  var html = orders.map(function(o) {
    var date = new Date(o.created_at).toLocaleDateString('en-US', {
      year: 'numeric', month: 'short', day: 'numeric'
    });
    var itemsHtml = (o.order_items || []).map(function(it) {
      return '<div class="order-item">'
        + '<div class="order-item-img">'
          + (it.product_image
              ? '<img src="' + it.product_image + '" alt="">'
              : '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="color: var(--orange);"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg>')
        + '</div>'
        + '<div class="order-item-info">'
          + '<p class="order-item-name">' + escapeHtml(it.product_name) + '</p>'
          + '<p class="order-item-meta">Qty ' + it.quantity + ' · ' + window.formatMoney(it.unit_price_cents) + ' each</p>'
        + '</div>'
      + '</div>';
    }).join('');

    var trackingBtn = (o.tracking_url || o.tracking_number)
      ? '<a class="order-action" href="' + (o.tracking_url || '#') + '" target="_blank" rel="noopener">Track package</a>'
      : '';

    return '<article class="order-card">'
      + '<div class="order-card-header">'
        + '<div><p class="order-meta-label">Order placed</p><p class="order-meta-value">' + date + '</p></div>'
        + '<div><p class="order-meta-label">Total</p><p class="order-meta-value">' + window.formatMoney(o.total_cents) + '</p></div>'
        + '<div><p class="order-meta-label">Order #</p><p class="order-meta-value">' + escapeHtml(o.order_number || '') + '</p></div>'
        + '<div><p class="order-meta-label">Status</p><span class="order-status" data-s="' + o.status + '">' + o.status + '</span></div>'
        + '<a class="order-action" href="/account/orders/detail?id=' + o.id + '">View details</a>'
      + '</div>'
      + '<div class="order-card-body"><div class="order-items">' + itemsHtml + '</div></div>'
      + (trackingBtn
          ? '<div class="order-card-actions">' + trackingBtn
              + ' <a class="order-action" href="/account/tickets/new?order=' + o.id + '">Need help with this order?</a>'
            + '</div>'
          : '<div class="order-card-actions">'
              + '<a class="order-action" href="/account/tickets/new?order=' + o.id + '">Need help with this order?</a>'
            + '</div>')
    + '</article>';
  }).join('');

  document.getElementById('ordersList').innerHTML = html;
})();

function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c) {
    return ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' })[c];
  });
}
</script>

</body>
</html>
