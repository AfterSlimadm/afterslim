<style>
html, body { background: #ffffff !important; }
/* Detail page precisa de mais largura pra acomodar o grid 2-col + invoice
   full-width abaixo. Default da .account-page eh 720px (apertado). */
main.account-page { max-width: 980px; text-align: left; padding-top: 16px; }

/* Toast que aparece quando o cliente clica em Download invoice. Avisa
   que o dialog de impressao vai abrir e onde escolher "Save as PDF". */
.od-toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: #0f1111;
  color: #fff;
  padding: 12px 20px;
  border-radius: 10px;
  font-size: 13px;
  font-weight: 500;
  box-shadow: 0 10px 30px rgba(0,0,0,0.25);
  z-index: 9999;
  opacity: 0;
  pointer-events: none;
  transition: opacity 200ms, transform 200ms;
  max-width: 92vw;
  text-align: center;
}
.od-toast.is-visible { opacity: 1; transform: translateX(-50%) translateY(0); }
main.account-page .od-card,
main.account-page .od-card *,
main.account-page .od-invoice,
main.account-page .od-invoice * { text-align: left; }

/* Barra de acoes no topo da pagina (acima do hero), alinhada a direita.
   Contem Download invoice + Need help — fora do card, no canto. */
.od-top-actions {
  display: flex;
  justify-content: flex-end;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 14px;
}

.od-hero {
  background: linear-gradient(to right, #ea580c 0%, #ea580c 55%, #c2410c 100%);
  border: 1px solid #c2410c;
  border-radius: 12px 12px 0 0;
  padding: 22px 26px;
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 20px;
  align-items: center;
  color: #fff;
}
/* Variante subscription: hero amarelo (mesma cor da listagem + /account/subscriptions). */
.od-hero--subscription {
  background: linear-gradient(to right, #fbbf24 0%, #fbbf24 55%, #d97706 100%) !important;
  border-color: #92400e !important;
}
.od-hero--subscription .od-hero-eyebrow,
.od-hero--subscription h1,
.od-hero--subscription .od-hero-sub,
.od-hero--subscription .od-hero-status,
.od-hero--subscription .od-hero-status-label {
  text-shadow: 0 1px 1px rgba(146, 64, 14, 0.25);
}
.od-hero-eyebrow {
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.85);
  margin: 0 0 4px;
}
.od-hero h1 {
  font-size: 24px;
  font-weight: 700;
  margin: 0 0 6px;
  letter-spacing: -0.01em;
  color: #fff;
}
.od-hero-sub {
  font-size: 14px;
  color: rgba(255,255,255,0.92);
  margin: 0;
}
.od-hero-status {
  font-size: 13px;
  font-weight: 700;
  color: #fff;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  align-self: end;
  text-align: right;
}
.od-hero-status-label {
  display: block;
  font-size: 11px;
  font-weight: 600;
  color: rgba(255,255,255,0.75);
  letter-spacing: 0.08em;
  margin-bottom: 2px;
}

.od-card {
  background: #fff;
  border: 1px solid #d5d9d9;
  border-radius: 0 0 12px 12px;
  border-top: 0;
  padding: 26px;
  margin-bottom: 24px;
}

.od-grid {
  display: grid;
  grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr);
  gap: 28px;
  align-items: start;
}
@media (max-width: 760px) { .od-grid { grid-template-columns: 1fr; } }

/* Bloco summary do lado direito do grid top. Sem padding-top extra pra
   alinhar o titulo ORDER SUMMARY com o titulo ITEMS IN THIS ORDER do
   left col, que comeca em y=0. O titulo interno recebe padding/border
   estilo "header" do card, dando o respiro visual sem desalinhar. */
.od-summary-block {
  background: #fafafa;
  border: 1px solid #e7e7e7;
  border-radius: 10px;
  padding: 0 20px 18px;
}
.od-summary-block .od-section-title {
  margin: 0 -20px 14px !important;
  padding: 14px 20px !important;
  border-bottom: 1px solid #e7e7e7 !important;
  text-align: center !important;
}
/* Sem linhas separadoras antes de Total e Payment method dentro do bloco
   summary — Allan removeu pra ficar mais limpo. */
.od-summary-block .od-summary-row.od-total {
  border-top: 0 !important;
  margin-top: 0 !important;
  padding-top: 6px !important;
}
.od-summary-block .od-info-block {
  border-top: 0 !important;
  padding-top: 6px !important;
}

/* Return policy mora dentro do header do invoice (lado direito), alinhado
   com Invoice # / Date issued / Date paid no lado esquerdo. Padding-top
   alinha o topo do label "RETURN POLICY" com o topo do h2 "Invoice"
   (o h2 tem mais cap-height entao o label fica visualmente mais alto sem
   esse offset). */
/* Return policy mora na coluna direita do header (mesma coluna do SOLD BY abaixo). */
.od-return-inline { padding-top: 4px; }
.od-return-inline .od-info-label { margin: 0 0 6px; }
.od-return-inline .od-invoice-meta-line { margin: 2px 0; }

/* Invoice em largura total ABAIXO do grid. Mesmo padding horizontal do
   .od-card (26px) pra alinhar com Items/Shipping acima. */
.od-invoice {
  background: #fafafa;
  border: 1px solid #e7e7e7;
  border-radius: 10px;
  padding: 24px 26px;
  margin-top: 24px;
}
.od-invoice-head {
  display: grid;
  grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr);
  gap: 28px;
  align-items: start;
  margin-bottom: 18px;
  padding-bottom: 14px;
  border-bottom: 1px solid #e7e7e7;
}
@media (max-width: 600px) { .od-invoice-head { grid-template-columns: 1fr; } }
.od-invoice-head h2 {
  font-size: 18px;
  font-weight: 700;
  margin: 0 0 8px;
  color: #0f1111;
  letter-spacing: -0.01em;
}
.od-invoice-grid {
  display: grid;
  grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr);
  gap: 28px;
}
@media (max-width: 600px) { .od-invoice-grid { grid-template-columns: 1fr; } }

.od-section { margin-bottom: 28px; }
.od-section:last-child { margin-bottom: 0; }
.od-section-title {
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: #565959;
  margin: 0 0 14px;
}

/* Items */
.od-items { list-style: none; padding: 0; margin: 0; }
.od-item {
  display: grid;
  grid-template-columns: 64px 1fr auto;
  gap: 16px;
  align-items: center;
  padding: 14px 0;
  border-bottom: 1px solid #f1f1f1;
}
.od-item:last-child { border-bottom: 0; }
.od-item-thumb {
  width: 64px;
  height: 64px;
  border-radius: 8px;
  background: #fafafa;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
}
.od-item-thumb img { max-width: 100%; max-height: 100%; object-fit: contain; padding: 4px; }
.od-item-name { font-size: 14px; font-weight: 600; color: #0f1111; margin: 0 0 4px; line-height: 1.35; }
.od-item-meta { font-size: 13px; color: #565959; margin: 0; }
.od-item-meta a { color: inherit !important; text-decoration: none !important; }
.od-item-total {
  font-size: 14px;
  font-weight: 600;
  color: #0f1111;
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
}

/* Summary */
.od-summary-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 8px 0;
  font-size: 14px;
  color: #0f1111;
}
.od-summary-row span:first-child { color: #565959; }
.od-summary-row span:last-child { font-variant-numeric: tabular-nums; }
.od-summary-row.od-discount span:last-child { color: #c2410c; font-weight: 600; }
.od-summary-row.od-total {
  border-top: 1px solid #e7e7e7;
  margin-top: 8px;
  padding-top: 14px;
  font-size: 16px;
  font-weight: 700;
}
.od-summary-row.od-total span:first-child { color: #0f1111; }

/* Address + shipping method */
.od-address {
  font-size: 14px;
  line-height: 1.55;
  color: #0f1111;
  margin: 0 0 10px;
}
.od-address strong { display: block; margin-bottom: 4px; }
.od-meta-line {
  font-size: 13px;
  color: #565959;
  margin: 6px 0 0;
  overflow-wrap: break-word;
  word-break: normal;
}
.od-meta-line strong { color: #0f1111; }

/* Bloco de dados destacado dentro do invoice (billed-to, vendor info).
   Layout coluna com nome em destaque e endereco abaixo, sem colar. */
.od-info-block {
  margin-top: 10px;
  padding-top: 10px;
  border-top: 1px dashed #e7e7e7;
}
.od-info-block:first-of-type { border-top: 0; padding-top: 0; }
.od-info-label {
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: #565959;
  margin: 0 0 4px;
}
.od-info-name {
  font-size: 14px;
  font-weight: 700;
  color: #0f1111;
  margin: 0 0 4px;
  line-height: 1.35;
}
.od-info-text {
  font-size: 13px;
  color: #0f1111;
  line-height: 1.55;
  margin: 0;
  word-break: break-word;
}
.od-info-text a { color: inherit !important; text-decoration: none !important; }

/* Action buttons */
.od-actions {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin-top: 18px;
}
.od-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  font-size: 13px;
  font-weight: 600;
  padding: 10px 18px;
  border-radius: 999px;
  text-decoration: none;
  cursor: pointer;
  font-family: inherit;
  transition: background 0.15s, border-color 0.15s, color 0.15s, box-shadow 0.15s;
  white-space: nowrap;
}
.od-btn svg { width: 14px; height: 14px; }
.od-btn--primary {
  background: linear-gradient(to right, #ea580c 0%, #ea580c 55%, #c2410c 100%);
  border: 1px solid transparent;
  color: #fff;
  box-shadow: 0 1px 2px rgba(194,65,12,0.2);
}
.od-btn--primary:hover {
  background: linear-gradient(to right, #c2410c 0%, #c2410c 55%, #8a2f0d 100%);
  box-shadow: 0 4px 14px rgba(194,65,12,0.32);
}
.od-btn--secondary {
  background: #fff;
  border: 1.5px solid #ea580c;
  color: #c2410c;
}
/* Tracking timeline */
.od-tracking {
  background: #fff;
  border: 1px solid #eee5dc;
  border-radius: 16px;
  padding: 24px 26px;
  margin-bottom: 24px;
}
.od-tracking-head {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 16px;
  margin-bottom: 18px;
  flex-wrap: wrap;
}
.od-tracking-head h2 {
  font-size: 16px;
  font-weight: 700;
  color: #0f1111;
  margin: 0;
  letter-spacing: -0.01em;
}
.od-tracking-meta {
  font-size: 13px;
  color: #565959;
}
.od-tracking-meta a { color: #c2410c; text-decoration: underline; font-weight: 600; }
.od-timeline {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr 1fr;
  position: relative;
  margin: 0;
}
.od-timeline-step {
  position: relative;
  padding-top: 32px;
  text-align: center;
}
.od-timeline-step::before {
  content: '';
  position: absolute;
  top: 9px;
  left: 50%;
  width: 14px;
  height: 14px;
  background: #fff;
  border: 2px solid #d8d4cf;
  border-radius: 50%;
  transform: translateX(-50%);
  z-index: 2;
}
.od-timeline-step.is-done::before {
  background: #ea580c;
  border-color: #ea580c;
}
.od-timeline-step.is-current::before {
  background: #ea580c;
  border-color: #ea580c;
  box-shadow: 0 0 0 4px rgba(234,88,12,0.18);
}
/* Linha conectora entre os passos */
.od-timeline-step::after {
  content: '';
  position: absolute;
  top: 15px;
  left: 50%;
  width: 100%;
  height: 2px;
  background: #e7e3dc;
  z-index: 1;
}
.od-timeline-step:last-child::after { display: none; }
.od-timeline-step.is-done::after { background: #ea580c; }
.od-timeline-step-label {
  font-size: 13px;
  font-weight: 600;
  color: #0f1111;
  margin: 0 0 2px;
}
.od-timeline-step-date {
  font-size: 12px;
  color: #565959;
  margin: 0;
}
.od-timeline-step.is-pending .od-timeline-step-label { color: #8a7a6e; }
@media (max-width: 600px) {
  .od-tracking { padding: 18px; }
  .od-timeline { gap: 0; }
  .od-timeline-step-label { font-size: 11px; }
  .od-timeline-step-date { font-size: 10px; }
}

/* Event history (lista estilo USPS de movimentacoes do pacote). */
.od-events-title {
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: #565959;
  margin: 28px 0 14px;
}
.od-events {
  list-style: none;
  padding: 0;
  margin: 0;
  border-top: 1px solid #eee5dc;
}
.od-event {
  display: grid;
  grid-template-columns: 100px 1fr;
  gap: 16px;
  padding: 14px 0;
  border-bottom: 1px solid #eee5dc;
  font-size: 14px;
  align-items: start;
}
.od-event-date {
  color: #565959;
  font-size: 12.5px;
  line-height: 1.45;
}
.od-event-date strong { display: block; color: #0f1111; font-weight: 600; font-size: 13.5px; }
.od-event-body { color: #0f1111; line-height: 1.5; }
.od-event-body strong { font-weight: 600; }
.od-event-location {
  display: block;
  color: #565959;
  font-size: 12.5px;
  margin-top: 2px;
}
.od-event:first-child .od-event-body strong { color: #c2410c; }
.od-events-empty {
  padding: 6px 0 4px;
  font-size: 13.5px;
  color: #8a7a6e;
  line-height: 1.55;
}
@media (max-width: 600px) {
  .od-event { grid-template-columns: 1fr; gap: 4px; }
  .od-event-date { font-size: 12px; }
}

.od-btn--secondary:hover {
  background: #fff3e6;
  color: #8a2f0d;
}

.od-invoice-meta-line {
  font-size: 13px;
  color: #565959;
  margin: 4px 0 0;
}
.od-invoice-foot {
  margin-top: 18px;
  padding-top: 16px;
  border-top: 1px solid #e7e7e7;
}
.od-invoice-foot p { word-break: break-word; }

.od-loading { padding: 56px 0; text-align: center; color: #565959; font-size: 14px; }

/* PRINT */
@media print {
  body { background: #fff; }
  nav.nav, .account-page-back, .od-actions, .od-print-hide { display: none !important; }
  .od-hero {
    background: #fff !important;
    color: #0f1111 !important;
    border: 0 !important;
    border-bottom: 2px solid #ea580c !important;
    border-radius: 0 !important;
    padding: 0 0 20px !important;
  }
  .od-hero h1, .od-hero-eyebrow, .od-hero-sub { color: #0f1111 !important; }
  .od-hero-eyebrow { color: #ea580c !important; }
  .od-hero-status { color: #ea580c !important; }
  .od-hero-status-label { color: #565959 !important; }
  .od-card { border: 0 !important; padding: 20px 0 !important; }
  .account-page { padding: 20px !important; max-width: none !important; }
  a { color: #0f1111 !important; text-decoration: none !important; }

  /* Page breaks: bloco invoice fica inteiro em uma pagina, items
     individuais nao quebram, e o head do invoice (Invoice # + Return
     policy + BILLED TO/SOLD BY) fica colado. */
  @page { size: A4; margin: 14mm; }
  .od-invoice,
  .od-invoice-head,
  .od-invoice-grid,
  .od-info-block,
  .od-items > li,
  .od-summary-block { break-inside: avoid; page-break-inside: avoid; }
  .od-invoice { margin-top: 12px !important; padding: 16px 0 0 !important; border-top: 1px solid #e7e7e7 !important; background: #fff !important; }
  .od-card + .od-invoice { margin-top: 16px !important; }
  /* Tira o background cinza do summary no print, fica enxuto. */
  main.account-page .od-card,
  main.account-page .od-invoice,
  .od-summary-block { background: #fff !important; }
}
</style>

      Orders
    </a>
    <a href="/" class="nav-logo" aria-label="AfterSlim home"><img src="/images/logo-afterslim-tight.png" alt="AfterSlim"></a>
    <span style="width: 64px;"></span>

<main class="account-page">
  <div id="orderBody" class="od-loading">Loading order...</div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="/js/supabase-client.js"></script>
<script>
(async function() {
  var user = await window.afterslimAuth.requireAuth();
  var supabase = window.afterslimSupabase;
  var params = new URLSearchParams(window.location.search);
  var orderId = params.get('id');

  if (!orderId) {
    document.getElementById('orderBody').innerHTML =
      '<div class="account-empty"><p>No order specified. <a href="/account/orders" style="color: #c2410c; font-weight: 600;">Back to orders</a></p></div>';
    return;
  }

  var { data: order, error } = await supabase
    .from('orders')
    .select('id, order_number, email, status, subtotal_cents, discount_cents, shipping_cents, tax_cents, total_cents, shipping_address, shipping_method, tracking_number, tracking_url, coupon_code, stripe_payment_intent_id, payment_brand, payment_last4, billing_name, billing_address, metadata, created_at, shipped_at, delivered_at, order_items(product_name, product_image, quantity, unit_price_cents)')
    .eq('profile_id', user.id)
    .eq('id', orderId)
    .maybeSingle();

  if (error || !order) {
    document.getElementById('orderBody').innerHTML =
      '<div class="account-empty"><p>Order not found or you don\'t have access. <a href="/account/orders" style="color: #c2410c; font-weight: 600;">Back to orders</a></p></div>';
    return;
  }

  var placedAt = new Date(order.created_at);
  var datePretty = placedAt.toLocaleDateString('en-US', {
    year: 'numeric', month: 'long', day: 'numeric'
  });
  var dateShort = placedAt.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });

  // Address — campos do shipping_address vem como { name, line1, line2, city, state, postal_code, country }
  var addr = order.shipping_address || {};
  var addrName = addr.name || '';
  var addressHtml = (addr.line1)
    ? '<strong>' + escapeHtml(addrName) + '</strong>'
      + escapeHtml(addr.line1)
      + (addr.line2 ? '<br>' + escapeHtml(addr.line2) : '')
      + '<br>' + escapeHtml(addr.city || '') + ', ' + escapeHtml(addr.state || '') + ' ' + escapeHtml(addr.postal_code || '')
      + '<br>' + escapeHtml(addr.country || 'US')
    : '<em style="color: #8a7a6e;">No address on file</em>';

  // Shipping method label friendly
  var shipMethodLabel = order.shipping_method === 'express'
    ? 'DHL Expedited (2-3 days)'
    : (order.shipping_method === 'standard' ? 'Standard Shipping (5-7 days)' : (order.shipping_method || 'Standard'));
  // Label curta (sem prazo) pra usar no Order Summary, ex: "Shipping (DHL Expedited)".
  var shipMethodShort = order.shipping_method === 'express'
    ? 'DHL Expedited'
    : (order.shipping_method === 'standard' ? 'Standard' : (order.shipping_method || ''));

  // Items
  var itemsHtml = (order.order_items || []).map(function(it) {
    var qty = it.quantity || 1;
    var lineTotal = (it.unit_price_cents || 0) * qty;
    // Bundle image fallback by qty
    var fallback = '/images/bundle-' + Math.max(1, Math.min(3, qty)) + '.webp';
    var img = it.product_image || fallback;
    return '<li class="od-item">'
      + '<div class="od-item-thumb"><img src="' + img + '" alt="' + escapeHtml(it.product_name || 'AfterSlim') + '" loading="lazy"></div>'
      + '<div>'
        + '<p class="od-item-name">' + escapeHtml(it.product_name || 'AfterSlim') + '</p>'
        + '<p class="od-item-meta">Qty ' + qty + ' . ' + window.formatMoney(it.unit_price_cents || 0) + ' each</p>'
      + '</div>'
      + '<div class="od-item-total">' + window.formatMoney(lineTotal) + '</div>'
    + '</li>';
  }).join('');

  // Payment method label (HSA/FSA-friendly): "Visa ending in 4242"
  var paymentLine;
  if (order.payment_brand && order.payment_last4) {
    var brandPretty = (order.payment_brand.charAt(0).toUpperCase() + order.payment_brand.slice(1)).replace(/_/g, ' ');
    paymentLine = brandPretty + ' ending in ' + escapeHtml(order.payment_last4);
  } else {
    paymentLine = 'Card via Stripe';
  }

  // Billed-to: nome do cartao + endereco de cobranca (separado do shipping)
  var billingName = order.billing_name || addr.name || '';
  var billingAddr = order.billing_address;
  var billedAddressLines = '';
  if (billingAddr && billingAddr.line1) {
    billedAddressLines = escapeHtml(billingAddr.line1)
      + (billingAddr.line2 ? '<br>' + escapeHtml(billingAddr.line2) : '')
      + '<br>' + escapeHtml(billingAddr.city || '') + ', ' + escapeHtml(billingAddr.state || '') + ' ' + escapeHtml(billingAddr.postal_code || '')
      + '<br>' + escapeHtml(billingAddr.country || 'US');
  }

  // Return window
  var returnEnd = new Date(placedAt);
  returnEnd.setDate(returnEnd.getDate() + 90);
  var returnPretty = returnEnd.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });

  // Status pretty
  var statusCap = (order.status || '').charAt(0).toUpperCase() + (order.status || '').slice(1);

  // Tracking URL: usa tracking_url se ja salvo, senao constroi a partir do carrier
  var carrierUrls = {
    usps: 'https://tools.usps.com/go/TrackConfirmAction?qtc_tLabels1=',
    ups: 'https://www.ups.com/track?tracknum=',
    fedex: 'https://www.fedex.com/fedextrack/?trknbr=',
    dhl: 'https://www.dhl.com/us-en/home/tracking/tracking-express.html?submit=1&tracking-id=',
    dhl_ecommerce: 'https://webtrack.dhlecs.com/?trackingnumber='
  };
  var trackingUrl = order.tracking_url
    || (order.tracking_number && order.tracking_carrier && carrierUrls[order.tracking_carrier]
        ? carrierUrls[order.tracking_carrier] + encodeURIComponent(order.tracking_number)
        : '');
  var carrierPretty = order.tracking_carrier
    ? ({usps:'USPS', ups:'UPS', fedex:'FedEx', dhl:'DHL Express', dhl_ecommerce:'DHL eCommerce'}[order.tracking_carrier] || order.tracking_carrier.toUpperCase())
    : null;

  var trackingBtn = (trackingUrl || order.tracking_number)
    ? '<a class="od-btn od-btn--secondary" href="' + (trackingUrl || '#') + '" target="_blank" rel="noopener">'
        + '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5"/><path d="M21 3l-7 7"/><path d="M8 21H3v-5"/><path d="M3 21l7-7"/></svg>'
        + 'Track package</a>'
    : '';

  // Tracking timeline: Placed -> Shipped -> In transit -> Delivered
  var shippedAt = order.shipped_at ? new Date(order.shipped_at) : null;
  var deliveredAt = order.delivered_at ? new Date(order.delivered_at) : null;
  function fmtDate(d) { return d ? d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) : ''; }
  function fmtDateTime(d) {
    return d ? d.toLocaleString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }) : '';
  }
  // Estimated delivery: shipped_at + 6 dias (standard) ou + 3 dias (expedited)
  var isExpedited = (order.shipping_method || '').toLowerCase().indexOf('expedited') !== -1
    || (order.shipping_method || '').toLowerCase().indexOf('dhl') !== -1;
  var etaDate = null;
  if (shippedAt && !deliveredAt) {
    etaDate = new Date(shippedAt);
    etaDate.setDate(etaDate.getDate() + (isExpedited ? 3 : 6));
  } else if (!shippedAt) {
    etaDate = new Date(placedAt);
    etaDate.setDate(etaDate.getDate() + (isExpedited ? 4 : 8));
  }
  // 4-step timeline. "In transit" fica current quando o pacote saiu mas
  // ainda nao chegou (entre shipped_at e delivered_at).
  var step1Class = 'is-done';
  var step2Class = shippedAt ? 'is-done' : 'is-pending';
  var step3Class = shippedAt ? (deliveredAt ? 'is-done' : 'is-current') : 'is-pending';
  var step4Class = deliveredAt ? 'is-done is-current' : 'is-pending';

  // Event history — vem de order.tracking_events (array de {at, status, location, description}).
  // Sem integracao de carrier ainda, fallback eh um placeholder amigavel.
  var trackingEvents = Array.isArray(order.tracking_events) ? order.tracking_events.slice() : [];
  trackingEvents.sort(function(a, b) { return new Date(b.at) - new Date(a.at); });

  var eventsHtml;
  if (trackingEvents.length > 0) {
    eventsHtml = '<ul class="od-events">'
      + trackingEvents.map(function(ev) {
          var d = new Date(ev.at);
          var datePart = d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
          var timePart = d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
          var loc = (ev.location || '').trim();
          return '<li class="od-event">'
            + '<div class="od-event-date"><strong>' + escapeHtml(datePart) + '</strong>' + escapeHtml(timePart) + '</div>'
            + '<div class="od-event-body">'
              + '<strong>' + escapeHtml(ev.description || ev.status || 'Status update') + '</strong>'
              + (loc ? '<span class="od-event-location">' + escapeHtml(loc) + '</span>' : '')
            + '</div>'
          + '</li>';
        }).join('')
    + '</ul>';
  } else if (shippedAt) {
    // Pacote shipou mas nao temos eventos detalhados ainda. Mostra mini-history
    // com o que sabemos: shipped + (delivered se aplicavel).
    var seedEvents = [];
    if (deliveredAt) seedEvents.push({
      at: deliveredAt,
      label: 'Delivered',
      sub: 'Package delivered to ' + (addr.city ? addr.city + ', ' + (addr.state || '') : 'your address')
    });
    seedEvents.push({
      at: shippedAt,
      label: 'Shipped',
      sub: 'Package handed to ' + (carrierPretty || 'carrier') + (carrierPretty ? '. Tracking number issued.' : '.')
    });
    seedEvents.push({
      at: placedAt,
      label: 'Order placed',
      sub: 'Payment received. We\'re packing your order.'
    });
    eventsHtml = '<ul class="od-events">'
      + seedEvents.map(function(ev) {
          var d = new Date(ev.at);
          var datePart = d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
          var timePart = d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
          return '<li class="od-event">'
            + '<div class="od-event-date"><strong>' + escapeHtml(datePart) + '</strong>' + escapeHtml(timePart) + '</div>'
            + '<div class="od-event-body">'
              + '<strong>' + escapeHtml(ev.label) + '</strong>'
              + '<span class="od-event-location">' + escapeHtml(ev.sub) + '</span>'
            + '</div>'
          + '</li>';
        }).join('')
    + '</ul>';
  } else {
    eventsHtml = '<p class="od-events-empty">Detailed movement updates appear here once your package ships.</p>';
  }

  var trackingBlock =
    '<section class="od-tracking">'
      + '<div class="od-tracking-head">'
        + '<h2>Order tracking</h2>'
        + (order.tracking_number
            ? '<p class="od-tracking-meta">'
                + (carrierPretty ? escapeHtml(carrierPretty) + ' . ' : '')
                + (trackingUrl
                    ? '<a href="' + escapeHtml(trackingUrl) + '" target="_blank" rel="noopener">' + escapeHtml(order.tracking_number) + '</a>'
                    : escapeHtml(order.tracking_number))
              + '</p>'
            : '<p class="od-tracking-meta">Tracking number lands here once shipped.</p>')
      + '</div>'
      + '<div class="od-timeline">'
        + '<div class="od-timeline-step ' + step1Class + '">'
          + '<p class="od-timeline-step-label">Order placed</p>'
          + '<p class="od-timeline-step-date">' + fmtDate(placedAt) + '</p>'
        + '</div>'
        + '<div class="od-timeline-step ' + step2Class + '">'
          + '<p class="od-timeline-step-label">Shipped</p>'
          + '<p class="od-timeline-step-date">' + (shippedAt ? fmtDate(shippedAt) : 'Packing up') + '</p>'
        + '</div>'
        + '<div class="od-timeline-step ' + step3Class + '">'
          + '<p class="od-timeline-step-label">In transit</p>'
          + '<p class="od-timeline-step-date">' + (deliveredAt ? '' : (shippedAt ? 'On the way' : 'Awaiting handoff')) + '</p>'
        + '</div>'
        + '<div class="od-timeline-step ' + step4Class + '">'
          + '<p class="od-timeline-step-label">Delivered</p>'
          + '<p class="od-timeline-step-date">' + (deliveredAt ? fmtDate(deliveredAt) : (etaDate ? 'Expected ' + fmtDate(etaDate) : '')) + '</p>'
        + '</div>'
      + '</div>'
      + '<p class="od-events-title">Shipment activity</p>'
      + eventsHtml
    + '</section>';

  // Modo da pagina:
  //   sem hash -> "tracking" (hero + timeline + event history; sem items/summary/invoice)
  //   #invoice -> "invoice" (hero + items + summary + invoice card; sem tracking block)
  var isInvoiceMode = window.location.hash === '#invoice';

  // Action bar: invoice mode mostra Download invoice + Need help.
  // Tracking mode mostra Track package (link externo) + Need help.
  var actionBar = '<div class="od-top-actions od-print-hide">'
    + (isInvoiceMode ? '' : trackingBtn)
    + '<a class="od-btn od-btn--secondary" href="/account/tickets/new?order=' + order.id + '">'
      + '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>'
      + 'Need help</a>'
    + (isInvoiceMode
        ? '<button type="button" id="od-download-btn" class="od-btn od-btn--primary" data-order="' + escapeHtml(order.order_number || order.id) + '">'
            + '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>'
            + 'Download invoice</button>'
        : '')
  + '</div>';

  // Hero amarelo quando a order eh de subscription (mesma cor da listagem).
  var isSubscriptionOrder = !!(order.metadata && order.metadata.stripe_subscription_id);
  var heroClass = isSubscriptionOrder ? 'od-hero od-hero--subscription' : 'od-hero';
  var heroBlock = '<div class="' + heroClass + '">'
    + '<div>'
      + '<p class="od-hero-eyebrow">Order ' + escapeHtml(order.order_number || '') + '</p>'
      + '<h1>AfterSlim GLP-1 Companion</h1>'
      + '<p class="od-hero-sub">Placed on ' + datePretty + ' . ' + (order.order_items?.length || 0) + ' item' + ((order.order_items?.length || 0) !== 1 ? 's' : '') + ' . ' + window.formatMoney(order.total_cents) + ' total</p>'
    + '</div>'
    + '<div class="od-hero-status">'
      + '<span class="od-hero-status-label">Status</span>'
      + statusCap
    + '</div>'
  + '</div>';

  document.getElementById('orderBody').innerHTML =
    '<a href="/account/orders" class="account-page-back" style="margin-bottom:18px;">'
      + '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>'
      + 'Back to orders</a>'

    + actionBar
    + heroBlock
    + (isInvoiceMode ? '' : trackingBlock)
    + (isInvoiceMode ? renderInvoiceBlocks() : '');

  // Render dos blocos de items/summary/invoice (so em invoice mode).
  function renderInvoiceBlocks() {
    return ''

    + '<div class="od-card">'
      + '<div class="od-grid">'

        // LEFT: items + ship-to + return window
        + '<div>'
          + '<div class="od-section">'
            + '<h2 class="od-section-title">Items in this order</h2>'
            + '<ul class="od-items">' + itemsHtml + '</ul>'
          + '</div>'
          + '<div class="od-section">'
            + '<h2 class="od-section-title">Shipping address</h2>'
            + '<p class="od-address">' + addressHtml + '</p>'
            + '<p class="od-meta-line"><strong>Method:</strong> ' + shipMethodLabel + '</p>'
            + (order.tracking_number ? '<p class="od-meta-line"><strong>Tracking:</strong> ' + escapeHtml(order.tracking_number) + '</p>' : '')
          + '</div>'
        + '</div>'

        // RIGHT: summary compacto + actions
        + '<div>'
          + '<div class="od-summary-block">'
            + '<h2 class="od-section-title" style="border:0;padding:0;margin:0 0 12px">Order summary</h2>'
            + '<div class="od-summary-row"><span>Subtotal</span><span>' + window.formatMoney(order.subtotal_cents || 0) + '</span></div>'
            + (order.discount_cents > 0
                ? '<div class="od-summary-row od-discount"><span>Discount' + (order.coupon_code ? ' (' + escapeHtml(order.coupon_code) + ')' : '') + '</span><span>-' + window.formatMoney(order.discount_cents) + '</span></div>'
                : '')
            + '<div class="od-summary-row"><span>Shipping' + (shipMethodShort ? ' (' + escapeHtml(shipMethodShort) + ')' : '') + '</span><span>' + (order.shipping_cents > 0 ? window.formatMoney(order.shipping_cents) : 'Free') + '</span></div>'
            + '<div class="od-summary-row"><span>Sales tax</span><span>' + window.formatMoney(order.tax_cents || 0) + '</span></div>'
            + '<div class="od-summary-row od-total"><span>Total paid</span><span>' + window.formatMoney(order.total_cents) + '</span></div>'
            + '<div class="od-info-block" style="margin-top:14px">'
              + '<p class="od-info-label">Payment method</p>'
              + '<p class="od-info-text">' + paymentLine + '</p>'
            + '</div>'
          + '</div>'
        + '</div>'

      + '</div>'

    + '</div>'

    // INVOICE em largura total, SIBLING do card pra alinhar com Items.
    // Return policy mora dentro do head do invoice (lado direito), ao lado
    // dos dados de Invoice #/Date issued/Date paid.
    + '<div class="od-invoice">'
        + '<div class="od-invoice-head">'
          + '<div>'
            + '<h2>Invoice</h2>'
            + '<p class="od-invoice-meta-line"><strong>Invoice #:</strong> ' + escapeHtml(order.order_number || '') + '</p>'
            + '<p class="od-invoice-meta-line"><strong>Date issued:</strong> ' + dateShort + '</p>'
            + '<p class="od-invoice-meta-line"><strong>Date paid:</strong> ' + dateShort + '</p>'
          + '</div>'
          + '<div class="od-return-inline">'
            + '<p class="od-info-label">Return policy</p>'
            + '<p class="od-invoice-meta-line">90-day money-back guarantee.</p>'
            + '<p class="od-invoice-meta-line"><strong>Window closes ' + returnPretty + '.</strong></p>'
          + '</div>'
        + '</div>'

        + '<div class="od-invoice-grid">'
          // BILLED TO
          + '<div>'
            + '<p class="od-info-label">Billed to</p>'
            + (billingName ? '<p class="od-info-name">' + escapeHtml(billingName) + '</p>' : '')
            + (billedAddressLines ? '<p class="od-info-text">' + billedAddressLines + '</p>' : '')
            + (order.email ? '<p class="od-info-text" style="margin-top:6px">' + escapeHtml(order.email) + '</p>' : '')
          + '</div>'
          // SOLD BY
          + '<div>'
            + '<p class="od-info-label">Sold by</p>'
            + '<p class="od-info-name">VQ Group LLC</p>'
            + '<p class="od-info-text">'
              + '16362 Hamlin Hills Road<br>'
              + 'Winter Garden, FL 34787-8027<br>'
              + 'United States'
            + '</p>'
            + '<p class="od-info-text" style="margin-top:6px">support@afterslim.com</p>'
          + '</div>'
        + '</div>'

        + '<div class="od-invoice-foot">'
          + '<p style="font-size:11px;line-height:1.6;color:#8a7a6e;margin:0">'
            + 'Made in the USA . FDA-registered facility. '
            + 'This document serves as proof of purchase for tax, insurance reimbursement (HSA/FSA), and return purposes.'
          + '</p>'
        + '</div>'
      + '</div>';
  } // end renderInvoiceBlocks

  // Comportamento por hash:
  //   sem hash (View order details) -> abre no topo, mostra tracking primeiro
  //   #invoice -> scroll suave ate o card de invoice (vindo do link "Invoice")
  if (window.location.hash === '#invoice') {
    var inv = document.querySelector('.od-invoice');
    if (inv) setTimeout(function() { inv.scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 60);
  } else {
    window.scrollTo({ top: 0, behavior: 'instant' });
  }

  // Download invoice: usa window.print() do Chrome (renderiza o @media print
  // bonito) com toast antes (instruindo a escolher "Save as PDF") e toast
  // depois (confirmando o save). Detecta cancel via afterprint timing.
  var dlBtn = document.getElementById('od-download-btn');
  if (dlBtn) dlBtn.addEventListener('click', function() {
    var dialogOpenedAt = 0;
    showToast('Print dialog opening... choose "Save as PDF" to download.', 4000);
    function onAfterPrint() {
      window.removeEventListener('afterprint', onAfterPrint);
      var elapsed = Date.now() - dialogOpenedAt;
      // Se o dialog ficou aberto >1.2s, provavelmente o cliente clicou Save
      // (cancel/Esc fecha quase instantaneo). Mostra confirmacao.
      if (elapsed > 1200) {
        showToast('Invoice saved. Check your downloads folder.');
      }
    }
    window.addEventListener('afterprint', onAfterPrint);
    setTimeout(function() {
      dialogOpenedAt = Date.now();
      window.print();
    }, 250);
  });
})();

function showToast(message, durationMs) {
  var existing = document.querySelector('.od-toast');
  if (existing) existing.remove();
  var toast = document.createElement('div');
  toast.className = 'od-toast';
  toast.textContent = message;
  document.body.appendChild(toast);
  // force reflow then add class for transition
  void toast.offsetWidth;
  toast.classList.add('is-visible');
  setTimeout(function() {
    toast.classList.remove('is-visible');
    setTimeout(function() { toast.remove(); }, 250);
  }, durationMs || 3500);
}

function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c) {
    return ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' })[c];
  });
}
</script>

</body>
</html>
