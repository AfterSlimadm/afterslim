<style>
body { background: #ffffff; }

.od-hero {
  background: linear-gradient(to right, #ea580c 0%, #ea580c 55%, #c2410c 100%);
  border: 1px solid #c2410c;
  border-radius: 12px 12px 0 0;
  padding: 22px 26px;
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 20px;
  align-items: center;
  color: #fff;
}
.od-hero-eyebrow {
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.85);
  margin: 0 0 4px;
}
.od-hero h1 {
  font-size: 24px;
  font-weight: 700;
  margin: 0 0 6px;
  letter-spacing: -0.01em;
  color: #fff;
}
.od-hero-sub {
  font-size: 14px;
  color: rgba(255,255,255,0.92);
  margin: 0;
}
.od-hero-status {
  font-size: 13px;
  font-weight: 700;
  color: #fff;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  align-self: end;
  text-align: right;
}
.od-hero-status-label {
  display: block;
  font-size: 11px;
  font-weight: 600;
  color: rgba(255,255,255,0.75);
  letter-spacing: 0.08em;
  margin-bottom: 2px;
}

.od-card {
  background: #fff;
  border: 1px solid #d5d9d9;
  border-radius: 0 0 12px 12px;
  border-top: 0;
  padding: 26px;
  margin-bottom: 24px;
}

.od-grid {
  display: grid;
  grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr);
  gap: 28px;
}
@media (max-width: 760px) { .od-grid { grid-template-columns: 1fr; } }

.od-section { margin-bottom: 28px; }
.od-section:last-child { margin-bottom: 0; }
.od-section-title {
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: #565959;
  margin: 0 0 14px;
  padding-bottom: 8px;
  border-bottom: 1px solid #e7e7e7;
}

/* Items */
.od-items { list-style: none; padding: 0; margin: 0; }
.od-item {
  display: grid;
  grid-template-columns: 64px 1fr auto;
  gap: 16px;
  align-items: center;
  padding: 14px 0;
  border-bottom: 1px solid #f1f1f1;
}
.od-item:last-child { border-bottom: 0; }
.od-item-thumb {
  width: 64px;
  height: 64px;
  border-radius: 8px;
  background: #fafafa;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
}
.od-item-thumb img { max-width: 100%; max-height: 100%; object-fit: contain; padding: 4px; }
.od-item-name { font-size: 14px; font-weight: 600; color: #0f1111; margin: 0 0 4px; line-height: 1.35; }
.od-item-meta { font-size: 13px; color: #565959; margin: 0; }
.od-item-meta a { color: inherit !important; text-decoration: none !important; }
.od-item-total {
  font-size: 14px;
  font-weight: 600;
  color: #0f1111;
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
}

/* Summary */
.od-summary-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 8px 0;
  font-size: 14px;
  color: #0f1111;
}
.od-summary-row span:first-child { color: #565959; }
.od-summary-row span:last-child { font-variant-numeric: tabular-nums; }
.od-summary-row.od-discount span:last-child { color: #c2410c; font-weight: 600; }
.od-summary-row.od-total {
  border-top: 1px solid #e7e7e7;
  margin-top: 8px;
  padding-top: 14px;
  font-size: 16px;
  font-weight: 700;
}
.od-summary-row.od-total span:first-child { color: #0f1111; }

/* Address + shipping method */
.od-address {
  font-size: 14px;
  line-height: 1.55;
  color: #0f1111;
  margin: 0 0 10px;
}
.od-address strong { display: block; margin-bottom: 4px; }
.od-meta-line {
  font-size: 13px;
  color: #565959;
  margin: 8px 0 0;
  overflow-wrap: anywhere;
  word-break: break-word;
}

/* Action buttons */
.od-actions {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin-top: 18px;
}
.od-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  font-size: 13px;
  font-weight: 600;
  padding: 10px 18px;
  border-radius: 999px;
  text-decoration: none;
  cursor: pointer;
  font-family: inherit;
  transition: background 0.15s, border-color 0.15s, color 0.15s, box-shadow 0.15s;
  white-space: nowrap;
}
.od-btn svg { width: 14px; height: 14px; }
.od-btn--primary {
  background: linear-gradient(to right, #ea580c 0%, #ea580c 55%, #c2410c 100%);
  border: 1px solid transparent;
  color: #fff;
  box-shadow: 0 1px 2px rgba(194,65,12,0.2);
}
.od-btn--primary:hover {
  background: linear-gradient(to right, #c2410c 0%, #c2410c 55%, #8a2f0d 100%);
  box-shadow: 0 4px 14px rgba(194,65,12,0.32);
}
.od-btn--secondary {
  background: #fff;
  border: 1.5px solid #ea580c;
  color: #c2410c;
}
.od-btn--secondary:hover {
  background: #fff3e6;
  color: #8a2f0d;
}

/* Invoice block */
.od-invoice {
  background: #fafafa;
  border: 1px solid #e7e7e7;
  border-radius: 10px;
  padding: 22px 24px;
}
.od-invoice-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 14px;
  margin-bottom: 18px;
  padding-bottom: 14px;
  border-bottom: 1px solid #e7e7e7;
  flex-wrap: wrap;
}
.od-invoice-head h2 {
  font-size: 18px;
  font-weight: 700;
  margin: 0;
  color: #0f1111;
  letter-spacing: -0.01em;
}
.od-invoice-meta-line {
  font-size: 13px;
  color: #565959;
  margin: 4px 0 0;
}
.od-invoice-foot {
  margin-top: 18px;
  padding-top: 16px;
  border-top: 1px solid #e7e7e7;
  font-size: 11px;
  line-height: 1.6;
  color: #565959;
}
.od-invoice-foot strong { color: #0f1111; }

.od-loading { padding: 56px 0; text-align: center; color: #565959; font-size: 14px; }

/* PRINT */
@media print {
  body { background: #fff; }
  nav.nav, .account-page-back, .od-actions, .od-print-hide { display: none !important; }
  .od-hero {
    background: #fff !important;
    color: #0f1111 !important;
    border: 0 !important;
    border-bottom: 2px solid #ea580c !important;
    border-radius: 0 !important;
    padding: 0 0 20px !important;
  }
  .od-hero h1, .od-hero-eyebrow, .od-hero-sub { color: #0f1111 !important; }
  .od-hero-eyebrow { color: #ea580c !important; }
  .od-hero-status { color: #ea580c !important; }
  .od-hero-status-label { color: #565959 !important; }
  .od-card { border: 0 !important; padding: 20px 0 !important; }
  .account-page { padding: 20px !important; max-width: none !important; }
  a { color: #0f1111 !important; text-decoration: none !important; }
}
</style>

<body>
<noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-WVF2ZGCL"
height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>

<nav class="nav">
  <div class="nav-inner">
    <a href="/account/orders" class="nav-back" aria-label="Back to orders">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
      Orders
    </a>
    <a href="/" class="nav-logo" aria-label="AfterSlim home"><img src="/images/logo-afterslim-tight.png" alt="AfterSlim"></a>
    <span style="width: 64px;"></span>
  </div>
</nav>

<main class="account-page">
  <div id="orderBody" class="od-loading">Loading order...</div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="/js/supabase-client.js"></script>
<script>
(async function() {
  var user = await window.afterslimAuth.requireAuth();
  var supabase = window.afterslimSupabase;
  var params = new URLSearchParams(window.location.search);
  var orderId = params.get('id');

  if (!orderId) {
    document.getElementById('orderBody').innerHTML =
      '<div class="account-empty"><p>No order specified. <a href="/account/orders" style="color: #c2410c; font-weight: 600;">Back to orders</a></p></div>';
    return;
  }

  var { data: order, error } = await supabase
    .from('orders')
    .select('id, order_number, email, status, subtotal_cents, discount_cents, shipping_cents, tax_cents, total_cents, shipping_address, shipping_method, tracking_number, tracking_url, coupon_code, stripe_payment_intent_id, metadata, created_at, shipped_at, delivered_at, order_items(product_name, product_image, quantity, unit_price_cents)')
    .eq('profile_id', user.id)
    .eq('id', orderId)
    .maybeSingle();

  if (error || !order) {
    document.getElementById('orderBody').innerHTML =
      '<div class="account-empty"><p>Order not found or you don\'t have access. <a href="/account/orders" style="color: #c2410c; font-weight: 600;">Back to orders</a></p></div>';
    return;
  }

  var placedAt = new Date(order.created_at);
  var datePretty = placedAt.toLocaleDateString('en-US', {
    year: 'numeric', month: 'long', day: 'numeric'
  });
  var dateShort = placedAt.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });

  // Address — campos do shipping_address vem como { name, line1, line2, city, state, postal_code, country }
  var addr = order.shipping_address || {};
  var addrName = addr.name || '';
  var addressHtml = (addr.line1)
    ? '<strong>' + escapeHtml(addrName) + '</strong>'
      + escapeHtml(addr.line1)
      + (addr.line2 ? '<br>' + escapeHtml(addr.line2) : '')
      + '<br>' + escapeHtml(addr.city || '') + ', ' + escapeHtml(addr.state || '') + ' ' + escapeHtml(addr.postal_code || '')
      + '<br>' + escapeHtml(addr.country || 'US')
    : '<em style="color: #8a7a6e;">No address on file</em>';

  // Shipping method label friendly
  var shipMethodLabel = order.shipping_method === 'express'
    ? 'DHL Expedited (2-3 days)'
    : (order.shipping_method === 'standard' ? 'Standard Shipping (5-7 days)' : (order.shipping_method || 'Standard'));

  // Items
  var itemsHtml = (order.order_items || []).map(function(it) {
    var qty = it.quantity || 1;
    var lineTotal = (it.unit_price_cents || 0) * qty;
    // Bundle image fallback by qty
    var fallback = '/images/bundle-' + Math.max(1, Math.min(3, qty)) + '.webp';
    var img = it.product_image || fallback;
    return '<li class="od-item">'
      + '<div class="od-item-thumb"><img src="' + img + '" alt="' + escapeHtml(it.product_name || 'AfterSlim') + '" loading="lazy"></div>'
      + '<div>'
        + '<p class="od-item-name">' + escapeHtml(it.product_name || 'AfterSlim') + '</p>'
        + '<p class="od-item-meta">Qty ' + qty + ' . ' + window.formatMoney(it.unit_price_cents || 0) + ' each</p>'
      + '</div>'
      + '<div class="od-item-total">' + window.formatMoney(lineTotal) + '</div>'
    + '</li>';
  }).join('');

  // Payment method label: stripe_payment_intent_id eh pi_..., descricao curta
  var paymentLine = order.stripe_payment_intent_id
    ? 'Visa / Mastercard via Stripe . ref ' + escapeHtml(order.stripe_payment_intent_id.slice(0, 22)) + '...'
    : 'Stripe';

  // Return window
  var returnEnd = new Date(placedAt);
  returnEnd.setDate(returnEnd.getDate() + 90);
  var returnPretty = returnEnd.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });

  // Status pretty
  var statusCap = (order.status || '').charAt(0).toUpperCase() + (order.status || '').slice(1);

  var trackingBtn = (order.tracking_url || order.tracking_number)
    ? '<a class="od-btn od-btn--secondary" href="' + (order.tracking_url || '#') + '" target="_blank" rel="noopener">'
        + '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5"/><path d="M21 3l-7 7"/><path d="M8 21H3v-5"/><path d="M3 21l7-7"/></svg>'
        + 'Track package</a>'
    : '';

  document.getElementById('orderBody').innerHTML =
    '<a href="/account/orders" class="account-page-back" style="margin-bottom:18px;">'
      + '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>'
      + 'Back to orders</a>'

    + '<div class="od-hero">'
      + '<div>'
        + '<p class="od-hero-eyebrow">Order ' + escapeHtml(order.order_number || '') + '</p>'
        + '<h1>AfterSlim GLP-1 Companion</h1>'
        + '<p class="od-hero-sub">Placed on ' + datePretty + ' . ' + (order.order_items?.length || 0) + ' item' + ((order.order_items?.length || 0) !== 1 ? 's' : '') + ' . ' + window.formatMoney(order.total_cents) + ' total</p>'
      + '</div>'
      + '<div class="od-hero-status">'
        + '<span class="od-hero-status-label">Status</span>'
        + statusCap
      + '</div>'
    + '</div>'

    + '<div class="od-card">'
      + '<div class="od-grid">'

        // LEFT: items + ship-to + return window
        + '<div>'
          + '<div class="od-section">'
            + '<h2 class="od-section-title">Items in this order</h2>'
            + '<ul class="od-items">' + itemsHtml + '</ul>'
          + '</div>'
          + '<div class="od-section">'
            + '<h2 class="od-section-title">Shipping address</h2>'
            + '<p class="od-address">' + addressHtml + '</p>'
            + '<p class="od-meta-line"><strong>Method:</strong> ' + shipMethodLabel + '</p>'
            + (order.tracking_number ? '<p class="od-meta-line"><strong>Tracking:</strong> ' + escapeHtml(order.tracking_number) + '</p>' : '')
          + '</div>'
          + '<div class="od-section">'
            + '<h2 class="od-section-title">Return policy</h2>'
            + '<p class="od-meta-line">90-day money-back guarantee. <strong>Return window closes ' + returnPretty + '.</strong></p>'
          + '</div>'
        + '</div>'

        // RIGHT: invoice + actions
        + '<div>'
          + '<div class="od-invoice">'
            + '<div class="od-invoice-head">'
              + '<div>'
                + '<h2>Invoice</h2>'
                + '<p class="od-invoice-meta-line">' + escapeHtml(order.order_number || '') + ' . ' + dateShort + '</p>'
              + '</div>'
              + '<button type="button" class="od-btn od-btn--primary od-print-hide" onclick="window.print()">'
                + '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>'
                + 'Download</button>'
            + '</div>'
            + '<div class="od-summary-row"><span>Subtotal</span><span>' + window.formatMoney(order.subtotal_cents || 0) + '</span></div>'
            + (order.discount_cents > 0
                ? '<div class="od-summary-row od-discount"><span>Discount' + (order.coupon_code ? ' (' + escapeHtml(order.coupon_code) + ')' : '') + '</span><span>-' + window.formatMoney(order.discount_cents) + '</span></div>'
                : '')
            + '<div class="od-summary-row"><span>Shipping</span><span>' + (order.shipping_cents > 0 ? window.formatMoney(order.shipping_cents) : 'Free') + '</span></div>'
            + (order.tax_cents > 0
                ? '<div class="od-summary-row"><span>Sales tax</span><span>' + window.formatMoney(order.tax_cents) + '</span></div>'
                : '')
            + '<div class="od-summary-row od-total"><span>Total paid</span><span>' + window.formatMoney(order.total_cents) + '</span></div>'
            + '<p class="od-meta-line" style="margin-top:14px"><strong>Payment:</strong> ' + paymentLine + '</p>'
            + '<p class="od-meta-line"><strong>Billed to:</strong> ' + escapeHtml(order.email || '') + '</p>'
            + '<div class="od-invoice-foot">'
              + '<strong>VQ Group LLC</strong><br>'
              + 'Florida, United States<br>'
              + 'support@afterslim.com<br>'
              + 'Made in the USA . FDA-registered facility<br>'
              + 'This invoice serves as proof of purchase for tax and return purposes.'
            + '</div>'
          + '</div>'
          + '<div class="od-actions od-print-hide">'
            + trackingBtn
            + '<a class="od-btn od-btn--secondary" href="/account/tickets/new?order=' + order.id + '">'
              + '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>'
              + 'Need help with this order</a>'
          + '</div>'
        + '</div>'

      + '</div>'
    + '</div>';

  // Auto-foca a seção #invoice se vier do link "Invoice" da listagem
  if (window.location.hash === '#invoice') {
    var inv = document.querySelector('.od-invoice');
    if (inv) inv.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
})();

function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c) {
    return ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' })[c];
  });
}
</script>

</body>
