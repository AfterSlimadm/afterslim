<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Order Details — AfterSlim</title>
<link rel="icon" href="/favicon.ico">
<link rel="stylesheet" href="/styles/policy.css">
<link rel="stylesheet" href="/styles/account.css">
<style>
.od-grid { display: grid; grid-template-columns: 1.5fr 1fr; gap: 24px; }
@media (max-width: 760px) { .od-grid { grid-template-columns: 1fr; } }
.od-block {
  background: var(--bg-2);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 22px;
}
.od-block h2 {
  font-size: 15px;
  font-weight: 700;
  letter-spacing: 0.4px;
  text-transform: uppercase;
  margin: 0 0 14px;
  color: var(--ink-2);
}
.od-status-row {
  display: flex; align-items: center; gap: 12px;
  flex-wrap: wrap;
  margin: 0 0 18px;
}
.od-status {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 5px 12px; border-radius: 999px;
  font-size: 12.5px; font-weight: 700; text-transform: capitalize;
}
.od-status[data-s="pending"], .od-status[data-s="paid"] { background: rgba(234,88,12,0.1); color: var(--orange-dark); }
.od-status[data-s="processing"] { background: rgba(59,130,246,0.1); color: #1e40af; }
.od-status[data-s="shipped"] { background: rgba(168,85,247,0.12); color: #6b21a8; }
.od-status[data-s="delivered"] { background: rgba(22,163,74,0.1); color: #15803d; }
.od-status[data-s="cancelled"], .od-status[data-s="refunded"] { background: rgba(31,20,16,0.08); color: var(--ink-2); }

.od-items { display: flex; flex-direction: column; gap: 12px; }
.od-item { display: flex; gap: 14px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); }
.od-item:last-child { border-bottom: 0; }
.od-item-img {
  width: 64px; height: 64px;
  background: var(--orange-tint);
  border-radius: 10px;
  flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  overflow: hidden;
}
.od-item-img img { max-width: 100%; max-height: 100%; }
.od-item-info { flex: 1; min-width: 0; }
.od-item-name { font-size: 14.5px; font-weight: 600; margin: 0 0 2px; }
.od-item-meta { font-size: 13px; color: var(--ink-2); margin: 0; }
.od-item-price { font-size: 14px; font-weight: 600; color: var(--ink); white-space: nowrap; }

.od-summary-row {
  display: flex; justify-content: space-between;
  padding: 6px 0;
  font-size: 14px;
}
.od-summary-row.od-total {
  border-top: 1px solid var(--line);
  margin-top: 10px;
  padding-top: 14px;
  font-size: 16px;
  font-weight: 700;
}
.od-address-card { font-size: 14px; line-height: 1.55; color: var(--ink); }
.od-action-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 18px; }
.od-action {
  font-size: 13.5px; font-weight: 600;
  padding: 10px 18px;
  border-radius: 999px;
  background: var(--orange); color: #fff;
  text-decoration: none;
  border: 0;
}
.od-action:hover { background: var(--orange-dark); color: #fff; }
.od-action--ghost {
  background: transparent; color: var(--ink); border: 1px solid var(--line);
}
.od-action--ghost:hover { border-color: var(--orange); color: var(--orange); }

.od-loading { padding: 56px 0; text-align: center; color: var(--ink-2); }
</style>
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <a href="/account/orders" class="nav-back" aria-label="Back to orders">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
      Orders
    </a>
    <a href="/" class="nav-logo" aria-label="AfterSlim home"><img src="/images/logo-afterslim-tight.png" alt="AfterSlim"></a>
    <span style="width: 64px;"></span>
  </div>
</nav>

<main class="account-page">
  <a href="/account/orders" class="account-page-back">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
    Back to orders
  </a>
  <h1 id="orderTitle">Order details</h1>
  <p class="account-page-lede" id="orderSub">Loading order...</p>

  <div id="orderBody" class="od-loading">Loading...</div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="/js/supabase-client.js"></script>
<script>
(async function() {
  var user = await window.afterslimAuth.requireAuth();
  var supabase = window.afterslimSupabase;
  var params = new URLSearchParams(window.location.search);
  var orderId = params.get('id');

  if (!orderId) {
    document.getElementById('orderBody').innerHTML =
      '<div class="account-empty"><p>No order specified. <a href="/account/orders" style="color: var(--orange-dark);">Back to orders</a></p></div>';
    return;
  }

  var { data: order, error } = await supabase
    .from('orders')
    .select('id, order_number, status, subtotal_cents, discount_cents, shipping_cents, tax_cents, total_cents, shipping_address, shipping_method, tracking_number, tracking_url, coupon_code, created_at, shipped_at, delivered_at, order_items(product_name, product_image, quantity, unit_price_cents)')
    .eq('profile_id', user.id)
    .eq('id', orderId)
    .maybeSingle();

  if (error || !order) {
    document.getElementById('orderBody').innerHTML =
      '<div class="account-empty"><p>Order not found or you don\'t have access.</p></div>';
    return;
  }

  document.getElementById('orderTitle').textContent = 'Order ' + (order.order_number || '');
  var date = new Date(order.created_at).toLocaleDateString('en-US', {
    year: 'numeric', month: 'long', day: 'numeric'
  });
  document.getElementById('orderSub').textContent = 'Placed on ' + date;

  var addr = order.shipping_address || {};
  var addressHtml = (addr.address_line1)
    ? escapeHtml((addr.first_name || '') + ' ' + (addr.last_name || '')).trim() + '<br>'
      + escapeHtml(addr.address_line1) + '<br>'
      + (addr.address_line2 ? escapeHtml(addr.address_line2) + '<br>' : '')
      + escapeHtml(addr.city || '') + ', ' + escapeHtml(addr.state || '') + ' ' + escapeHtml(addr.zip_code || '')
    : 'No address on file';

  var itemsHtml = (order.order_items || []).map(function(it) {
    return '<div class="od-item">'
      + '<div class="od-item-img">'
        + (it.product_image
            ? '<img src="' + it.product_image + '" alt="">'
            : '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="color: var(--orange);"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg>')
      + '</div>'
      + '<div class="od-item-info">'
        + '<p class="od-item-name">' + escapeHtml(it.product_name) + '</p>'
        + '<p class="od-item-meta">Qty ' + it.quantity + '</p>'
      + '</div>'
      + '<div class="od-item-price">' + window.formatMoney((it.unit_price_cents || 0) * (it.quantity || 1)) + '</div>'
    + '</div>';
  }).join('');

  document.getElementById('orderBody').innerHTML =
    '<div class="od-status-row">'
      + '<span class="od-status" data-s="' + order.status + '">' + order.status + '</span>'
      + (order.tracking_number ? '<span style="font-size: 13.5px; color: var(--ink-2);">Tracking: <strong>' + escapeHtml(order.tracking_number) + '</strong></span>' : '')
    + '</div>'
    + '<div class="od-grid">'
      + '<div>'
        + '<div class="od-block">'
          + '<h2>Items</h2>'
          + '<div class="od-items">' + itemsHtml + '</div>'
        + '</div>'
        + '<div class="od-action-row">'
          + (order.tracking_url
              ? '<a class="od-action" href="' + order.tracking_url + '" target="_blank" rel="noopener">Track package</a>'
              : '')
          + '<a class="od-action od-action--ghost" href="/account/tickets/new?order=' + order.id + '">Need help with this order?</a>'
        + '</div>'
      + '</div>'
      + '<div>'
        + '<div class="od-block">'
          + '<h2>Summary</h2>'
          + '<div class="od-summary-row"><span>Subtotal</span><span>' + window.formatMoney(order.subtotal_cents) + '</span></div>'
          + (order.discount_cents > 0 ? '<div class="od-summary-row"><span>Discount' + (order.coupon_code ? ' (' + escapeHtml(order.coupon_code) + ')' : '') + '</span><span>-' + window.formatMoney(order.discount_cents) + '</span></div>' : '')
          + '<div class="od-summary-row"><span>Shipping</span><span>' + window.formatMoney(order.shipping_cents) + '</span></div>'
          + '<div class="od-summary-row"><span>Tax</span><span>' + window.formatMoney(order.tax_cents) + '</span></div>'
          + '<div class="od-summary-row od-total"><span>Total</span><span>' + window.formatMoney(order.total_cents) + '</span></div>'
        + '</div>'
        + '<div class="od-block" style="margin-top: 14px;">'
          + '<h2>Ship to</h2>'
          + '<p class="od-address-card">' + addressHtml + '</p>'
          + (order.shipping_method ? '<p style="font-size: 13px; color: var(--ink-2); margin: 12px 0 0;">Method: ' + escapeHtml(order.shipping_method) + '</p>' : '')
        + '</div>'
      + '</div>'
    + '</div>';
})();

function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c) {
    return ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' })[c];
  });
}
</script>

</body>
</html>
