  <div class="success-card">
    <div class="check-circle">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12"/>
      </svg>
    </div>
    <h1>Order Confirmed!</h1>
    <p class="desc">
      Thank you for your purchase. You'll receive a confirmation email shortly with your order details and tracking information.
    </p>
    <a href="/" class="btn">Back to AfterSlim</a>
    <div class="order-id" id="order-id"></div>
  </div>
  <script>
    (function(){
      var params = new URLSearchParams(window.location.search);
      var txnId = params.get('session_id') || params.get('payment_id') || params.get('payment_intent') || '';

      // Pull customer + cart context persisted by /checkout before redirect.
      // Used for purchase event value/items AND Enhanced Conversions user_data.
      var ctx = {};
      try {
        var raw = sessionStorage.getItem('as_order_ctx');
        if (raw) ctx = JSON.parse(raw) || {};
      } catch (e) {}

      // SHA-256 over a normalized string (trim + lowercase). Used to hash
      // email/phone for Enhanced Conversions per Google spec.
      async function sha256Hex(input) {
        if (!input) return '';
        var normalized = String(input).trim().toLowerCase();
        if (!normalized) return '';
        var buf = new TextEncoder().encode(normalized);
        var hash = await crypto.subtle.digest('SHA-256', buf);
        return Array.from(new Uint8Array(hash))
          .map(function(b){return b.toString(16).padStart(2,'0');})
          .join('');
      }

      // Normalize phone to E.164 (digits + leading +) before hashing.
      function normalizePhone(phone) {
        if (!phone) return '';
        var digits = String(phone).replace(/[^\d+]/g, '');
        if (!digits) return '';
        if (digits.charAt(0) !== '+') digits = '+1' + digits.replace(/^\+/, '');
        return digits;
      }

      async function pushPurchase() {
        if (!txnId && !ctx.value) return;
        document.getElementById('order-id').textContent = 'Your order has been confirmed.';

        var items = (ctx.items && ctx.items.length) ? ctx.items : [{
          item_id: 'AFTERSLIM-GLP1-COMPANION',
          item_name: 'AfterSlim GLP-1 Companion',
          item_brand: 'AfterSlim',
          item_category: 'Supplements',
          price: 27.99,
          quantity: 1
        }];
        var value = (typeof ctx.value === 'number' && ctx.value > 0) ? ctx.value : 27.99;

        var userData = {};
        try {
          if (ctx.email) userData.sha256_email_address = await sha256Hex(ctx.email);
          var phoneN = normalizePhone(ctx.phone);
          if (phoneN) userData.sha256_phone_number = await sha256Hex(phoneN);
        } catch (e) {}

        window.dataLayer = window.dataLayer || [];
        window.dataLayer.push({ ecommerce: null });
        window.dataLayer.push({
          event: 'purchase',
          ecommerce: {
            transaction_id: txnId,
            value: value,
            currency: ctx.currency || 'USD',
            coupon: ctx.coupon || undefined,
            items: items
          },
          user_data: userData
        });

        // Direct Google Ads conversion fire via gtag. We bypass the GTM
        // Custom Event trigger here because GTM was firing the conversion
        // ping with value=0 (couldn't pull ecommerce.value from dataLayer
        // reliably). gtag('set','user_data',...) enables Enhanced
        // Conversions on this hit.
        try {
          if (typeof window.gtag === 'function') {
            if (userData.sha256_email_address || userData.sha256_phone_number) {
              window.gtag('set', 'user_data', userData);
            }
            window.gtag('event', 'conversion', {
              send_to: 'AW-18141752970/9RbMCOGm5rQcEIrd1MpD',
              value: value,
              currency: ctx.currency || 'USD',
              transaction_id: txnId
            });
          }
        } catch (e) {}

        try { sessionStorage.removeItem('as_order_ctx'); } catch (e) {}
      }

      pushPurchase();
      window.history.replaceState({}, '', '/checkout/success');
    })();
  </script>
